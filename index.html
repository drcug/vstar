<style>
  @font-face{
    font-family:"WebPlus IBM VGA";
    src:url("assets/WebPlus_IBM_VGA_9x16.woff") format("woff");
    font-weight:normal;font-style:normal;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  #wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw}
  body.keyboard-open #wrap{position:fixed;left:0;right:0;width:100%;z-index:2}
  #scrb{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;touch-action:pan-y}
  body.edit-scroll #scrb{touch-action:none}
  body.portrait-zoom #scrb{align-items:flex-start;justify-content:flex-start}
  body.portrait-zoom #scrb canvas{margin:0;flex-shrink:0}
  body.keyboard-open #scrb{align-items:flex-start;justify-content:flex-start}
  canvas{display:block;background:#000;touch-action:manipulation}
  /* leggero effetto CRT (scanline + vignettatura) */
  #crt{pointer-events:none;position:fixed;inset:0;z-index:3;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.45) 100%);}
  /* ------- barra comandi touch ------- */
  #bar{display:none;flex:0 0 auto;flex-direction:column;background:#000;border-top:1px solid #444;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;z-index:4;max-height:46vh;overflow:hidden}
  body.showbar #bar{display:flex}
  #kb-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:5px;padding-bottom:4px}
  #kb-space{flex:0 0 auto;border-top:1px solid #444;padding-top:5px;margin-top:2px}
  body.text-only #bar{display:none!important}
  body.text-only.showbar #togglebar{opacity:.55}
  body.dirty-doc #togglebar{box-shadow:0 0 0 2px #f80}
  body.theme-green canvas,body.theme-green #bar button{color:#33ff33;border-color:#33ff33}
  body.theme-amber canvas,body.theme-amber #bar button{color:#ffb000;border-color:#ffb000}
  body.crt-off #crt{display:none!important}
  @media(max-width:520px){
    #togglezoom,#toggletext,#toggledrive,#togglefs{font-size:11px;padding:2px 5px}
    #togglezoom{left:4px;top:4px} #toggletext{left:4px;top:28px}

    #togglefs{top:28px;right:4px} #togglebar{top:4px;right:4px;font-size:16px;padding:2px 8px}
  }
  #ctx-menu{position:fixed;z-index:8;background:#000;border:1px solid var(--vs-fg,#fff);display:none;flex-direction:column;min-width:140px}
  #ctx-menu button{font-family:"WebPlus IBM VGA",monospace;background:#000;color:var(--vs-fg,#fff);border:0;border-bottom:1px solid #444;padding:10px 14px;text-align:left;cursor:pointer}
  #ctx-menu button:last-child{border-bottom:0}
  #ctx-menu button:active{background:var(--vs-fg,#fff);color:#000}
  #bar .kb-row{display:flex;gap:4px;width:100%;flex-shrink:0}
  #bar .kb-panel{display:none;flex-direction:column;gap:4px;width:100%;flex-shrink:0}
  body.showbar #bar.kb-abc #kb-panel-abc{display:flex}
  body.showbar #bar.kb-123 #kb-panel-123{display:flex}
  body.showbar #bar.kb-punct #kb-panel-punct{display:flex}
  body.showbar #bar.kb-accent #kb-panel-accent{display:flex}
  #bar button{font-family:"WebPlus IBM VGA","Courier New",monospace;font-size:clamp(14px,4.1vw,17px);line-height:1.1;
    background:#000;color:#fff;border:1px solid #fff;border-radius:0;padding:11px 4px;min-width:0;flex:1;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #bar button.wide{flex:5;min-width:72px}
  #bar button.tab{flex:1;min-width:42px;font-size:clamp(12px,3.5vw,15px);padding:9px 4px}
  #bar button.mic.on{background:#500;color:#fff;border-color:#f88}
  #bar button.on{background:#fff;color:#000}
  #togglebar{position:fixed;top:6px;right:6px;z-index:6;font-family:"WebPlus IBM VGA","Courier New",monospace;
    font-size:20px;background:#000;color:#fff;border:1px solid #fff;padding:3px 10px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #togglebar.on{background:#fff;color:#000}
  #togglezoom{position:fixed;top:6px;left:6px;z-index:6;display:none;font-family:"WebPlus IBM VGA","Courier New",monospace;
    font-size:18px;background:#000;color:#fff;border:1px solid #fff;padding:3px 10px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #togglezoom.on{background:#fff;color:#000}
  #toggledrive{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:6;display:none;
    font-family:"WebPlus IBM VGA","Courier New",monospace;font-size:14px;background:#000;color:#fff;
    border:1px solid #fff;padding:3px 8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toggledrive.on{background:#4285f4;color:#fff;border-color:#8ab4f8}
  #toggledrive.busy{opacity:.7}
  #togglefs{position:fixed;top:42px;right:6px;z-index:6;font-family:"WebPlus IBM VGA","Courier New",monospace;
    font-size:14px;background:#000;color:#fff;border:1px solid #fff;padding:3px 8px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #togglefs.on{background:#fff;color:#000}
  #toggletext{position:fixed;top:42px;left:6px;z-index:6;display:none;font-family:"WebPlus IBM VGA","Courier New",monospace;
    font-size:14px;background:#000;color:#fff;border:1px solid #fff;padding:3px 8px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #toggletext.on{background:#fff;color:#000}
  #sr-live{position:fixed;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  #opt-google-panel{display:none;position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:7;
    flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
  #btn-google-login{font-family:Roboto,Arial,sans-serif;font-size:15px;padding:11px 22px;background:#4285f4;
    color:#fff;border:1px solid #4285f4;border-radius:4px;cursor:pointer;touch-action:manipulation;
    box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px}
  #btn-google-login:active{background:#3367d6}
  #opt-google-hint{font-family:Roboto,Arial,sans-serif;font-size:12px;color:#ccc;text-align:center;max-width:280px}
  /* campo nascosto per aprire la tastiera di sistema su mobile */
  #keyin{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;
    background:transparent;color:transparent;font-size:16px;z-index:-1;resize:none;overflow:hidden}
</style>
</head>
<body>

    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.083 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 16.108 18.961 13 24 13c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.223 0-9.621-3.356-11.283-8.031l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    Accedi con Google
  </button>
  <div id="opt-google-hint">Salva i tuoi file .cio sul tuo Google Drive personale</div>

<script>
'use strict';
/* ------------------------------ COSTANTI ------------------------------ */
const COLS=80, ROWS=25, PAGE_LEN=66, LS_KEY='vaaardstar_disk';
const EXT='.CIO', MIME_CIO='application/x-vaaardstar+cio';
const IDB_NAME='vaaardstar', IDB_VER=2;
function getRM(){ return VSF?VSF.cfg.wrapMargin:65; }
const FONT='"WebPlus IBM VGA","Courier New",monospace';
function getFG(){ return (typeof VSExt!=='undefined'&&VSF)?VSExt.themeFG(VSF.cfg):'#ffffff'; }
const HAS_FSA='showOpenFilePicker' in window;
const GOOGLE_CLIENT_ID=(window.VAAARDSTAR_GOOGLE&&window.VAAARDSTAR_GOOGLE.clientId)||'';
const GOOGLE_SCOPE='https://www.googleapis.com/auth/drive.file openid email profile';
const DRIVE_FOLDER='VaaardStar';
const IS_TOUCH=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);

/* ------------------------------ STATO ------------------------------ */
const S={
  mode:'boot', helpFrom:'open',
  helpLevel:3, ruler:true, wrapOn:true, ins:true,
  doc:[''], ln:0, col:0, top:0,
  filename:'', dirty:false,
  blk:null, blkVis:true,
  markers:new Array(10).fill(null),
  prevPos:null,
  msg:'', prompt:null, pending:null,
  lastFind:'', lastRepl:'',
  helpPage:0,
  dosLines:[], dosInput:'', dosFrom:'open',
  undoStack:[], redoStack:[], bootAt:Date.now(),
  spellMarks:null, spellPos:0
};
let optPage=0,filePageOpen=0,filePageDir=0,fileHoverRow=-1,ctxFile=null;
let verPick=null,mergePreview=null,syncFilePage=0,swUpdatePending=false;
let lastTapAt=0,lastTapX=0,lastTapY=0,longPressTimer=null;
const FILES_PER_OPEN=7,FILES_PER_DIR=15,FILES_PER_SYNC=8,DISK_LIMIT=360*1024;

/* ------------------------------ DISCO VIRTUALE (IndexedDB) ------------------------------ */
const README=
"BENVENUTO IN VaaardStar\n"+
"=============================\n"+
"\n"+
"Clone del leggendario word processor per MS-DOS:\n"+
"schermo 80 colonne x 25 righe, testo bianco su nero.\n"+
"\n"+
"IL DIAMANTE DEL CURSORE\n"+
"  ^S sinistra  ^D destra  ^E su  ^X giu'\n"+
"  ^A parola sx  ^F parola dx\n"+
"  ^R pagina su  ^C pagina giu'  (anche PgUp/PgDn)\n"+
"\n"+
"SCRIVERE\n"+
"  RETURN fine paragrafo  BACKSPACE(^H) cancella a sinistra\n"+
"  CANC cancella carattere  ^T parola  ^Y riga\n"+
"  ^V INSERIMENTO on/off   ^U annulla   ^B riformatta\n"+
"  TAB indentazione\n"+
"\n"+
"BLOCCHI E FILE\n"+
"  ^KB inizio blocco  ^KK fine blocco  ^KH mostra/nascondi\n"+
"  ^KC copia  ^KV sposta  ^KY elimina\n"+
"  ^KW scrivi blocco su file  ^KR leggi file nel cursore\n"+
"  ^KS salva e continua  ^KD salva e torna al menu'\n"+
"  ^KQ abbandona  ^KT salva con nome\n"+
"\n"+
"CERCARE\n"+
"  ^QF trova  ^QA sostituisci  ^L ripeti  ^QP posizione prec.\n"+
"\n"+
"FORMATO FILE\n"+
"  I documenti VaaardStar usano l'estensione .cio (testo Unicode).\n"+
"  Puoi importare anche .txt e altri testi senza associarli all'app.\n"+
"\n"+
"SU TELEFONO/TABLET\n"+
"  Scorri il testo: trascina su/giu' nell'area di scrittura.\n"+
"  Su PC usa anche rotella del mouse e frecce (scorrono a fine pagina).\n"+
"  TASTIERA: righe QWERTY, 123, punteggiatura, accenti, CAPS, SPAZIO.\n"+
"  🎤 dettatura vocale (speech-to-text del browser).\n"+
"  ZOOM (portrait): testo ingrandito a tutto schermo.\n"+
"  Con barra aperta non si apre la tastiera Android.\n"+
"\n"+
"Nota: alcuni Ctrl (^T ^W ^N) possono essere intercettati\n"+
"dal browser: usa Ctrl+Backspace per ^T.\n"+
"I file restano salvati in questo browser (IndexedDB).\n"+
"V  Opzioni: accedi con Google al tuo Drive personale.\n"+
"Installa l'app PWA per lavorare offline e aprire i .cio.\n"+
"Menu: I importa file  B backup ZIP  U ripristina backup.\n"+
"Buona scrittura!\n";

let disk=null, diskReady=false, autosaveTimer=null;
let driveConnected=false, driveToken=null, driveTokenExp=0, driveFolderId=null, driveUserEmail='';
let driveFileMap={}, driveTokenClient=null, driveTokenWait=null, driveBusy=false;
const extHandles=new Map();
const pendingLaunch=[];
function googleConfigured(){ return !!(GOOGLE_CLIENT_ID&&GOOGLE_CLIENT_ID.indexOf('YOUR_')<0&&GOOGLE_CLIENT_ID.indexOf('.apps.googleusercontent.com')>0); }
function waitForGoogle(){
  return new Promise(res=>{
    if(window.google&&google.accounts)return res();
    let n=0;
    const t=setInterval(()=>{ if((window.google&&google.accounts)||++n>80){ clearInterval(t); res(); } },100);
  });
}
function initDriveClient(){
  if(driveTokenClient||!googleConfigured()||!window.google)return !!driveTokenClient;
  driveTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:GOOGLE_SCOPE,
    callback:resp=>{
      const cb=driveTokenWait;
      driveTokenWait=null;
      if(!cb)return;
      if(resp.error)cb(null,resp.error);
      else cb(resp.access_token,resp.expires_in||3600);
    }
  });
  return true;
}
function requestDriveToken(prompt){
  return new Promise((res,rej)=>{
    if(!initDriveClient())return rej(new Error('config'));
    driveTokenWait=(token,errOrSec)=>{
      if(!token)return rej(new Error(errOrSec||'auth'));
      driveToken=token;
      driveTokenExp=Date.now()+errOrSec*1000;
      res(token);
    };
    driveTokenClient.requestAccessToken({prompt:prompt||''});
  });
}
async function driveApi(path,opts,retry){
  let token=driveToken&&Date.now()<driveTokenExp-60000?driveToken:null;
  if(!token)token=await requestDriveToken('');
  const res=await fetch('https://www.googleapis.com/drive/v3/'+path,{
    ...opts,
    headers:{Authorization:'Bearer '+token,...(opts&&opts.headers||{})}
  });
  if(res.status===401&&!retry){
    driveToken=null;
    await requestDriveToken('consent');
    return driveApi(path,opts,true);
  }
  if(!res.ok)throw new Error(await res.text());
  if(res.status===204)return null;
  const ct=res.headers.get('content-type')||'';
  return ct.indexOf('json')>=0?res.json():res.text();
}
async function driveUpload(path,opts){
  let token=driveToken&&Date.now()<driveTokenExp-60000?driveToken:null;
  if(!token)token=await requestDriveToken('');
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/'+path,{
    ...opts,
    headers:{Authorization:'Bearer '+token,...(opts&&opts.headers||{})}
  });
  if(!res.ok)throw new Error(await res.text());
  return res.json();
}
async function ensureDriveFolder(){
  if(driveFolderId)return driveFolderId;
  const saved=await idbGetMeta('driveFolderId');
  if(saved){ driveFolderId=saved; return driveFolderId; }
  const q="mimeType='application/vnd.google-apps.folder' and name='"+DRIVE_FOLDER+"' and trashed=false";
  const list=await driveApi('files?q='+encodeURIComponent(q)+'&fields=files(id)&spaces=drive');
  if(list.files&&list.files.length)driveFolderId=list.files[0].id;
  else{
    const created=await driveApi('files',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})});
    driveFolderId=created.id;
  }
  await idbPutMeta('driveFolderId',driveFolderId);
  return driveFolderId;
}
async function driveDownloadText(id){
  let token=driveToken&&Date.now()<driveTokenExp-60000?driveToken:null;
  if(!token)token=await requestDriveToken('');
  const res=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{
    headers:{Authorization:'Bearer '+token}
  });
  if(res.status===401){
    driveToken=null;
    token=await requestDriveToken('consent');
    const res2=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{
      headers:{Authorization:'Bearer '+token}
    });
    if(!res2.ok)throw new Error(await res2.text());
    return res2.text();
  }
  if(!res.ok)throw new Error(await res.text());
  return res.text();
}
async function driveLoadAll(){
  const folderId=await ensureDriveFolder();
  const q="'"+folderId+"' in parents and trashed=false";
  const list=await driveApi('files?q='+encodeURIComponent(q)+'&fields=files(id,name,mimeType)&pageSize=200');
  const out={};
  driveFileMap={};
  for(const f of (list.files||[])){
    if(f.mimeType==='application/vnd.google-apps.folder')continue;
    const text=await driveDownloadText(f.id);
    const name=diskNameFromFile(f.name);
    out[name]=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    driveFileMap[name]=f.id;
  }
  if(!Object.keys(out).length)out['README.CIO']=README;
  await idbPutMeta('driveFileMap',driveFileMap);
  return out;
}
async function driveSaveFile(name,content){
  const folderId=await ensureDriveFolder();
  const fname=(name.indexOf('.')>=0?name:normDiskName(name,true)).toLowerCase();
  const id=driveFileMap[name];
  if(id){
    await driveUpload('files/'+id+'?uploadType=media',{method:'PATCH',
      headers:{'Content-Type':'text/plain; charset=UTF-8'},body:content});
    return id;
  }
  const boundary='vaaardstar'+Date.now();
  const meta=JSON.stringify({name:fname,parents:[folderId],mimeType:'text/plain'});
  const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+
    '\r\n--'+boundary+'\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n'+content+'\r\n--'+boundary+'--';
  const created=await driveUpload('files?uploadType=multipart&fields=id,name',{method:'POST',
    headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
  driveFileMap[name]=created.id;
  await idbPutMeta('driveFileMap',driveFileMap);
  return created.id;
}
async function driveDeleteFile(name){
  const id=driveFileMap[name];
  if(!id)return;
  await driveApi('files/'+id,{method:'DELETE'});
  delete driveFileMap[name];
  await idbPutMeta('driveFileMap',driveFileMap);
}
async function driveRenameFile(oldName,newName){
  const id=driveFileMap[oldName];
  const fname=(newName.indexOf('.')>=0?newName:normDiskName(newName,true)).toLowerCase();
  if(id){
    await driveApi('files/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:fname})});
    driveFileMap[newName]=id;
    delete driveFileMap[oldName];
    await idbPutMeta('driveFileMap',driveFileMap);
  }else if(disk&&disk[newName]!==undefined){
    await driveSaveFile(newName,disk[newName]);
  }
}
async function fetchDriveUserInfo(){
  try{
    let token=driveToken&&Date.now()<driveTokenExp-60000?driveToken:null;
    if(!token)token=await requestDriveToken('');
    const info=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
    if(info&&info.email){ driveUserEmail=info.email; await idbPutMeta('driveUserEmail',info.email); }
  }catch(e){}
}
function showGoogleLoginPanel(show){
  const p=document.getElementById('opt-google-panel');
  if(p)p.style.display=show?'flex':'none';
}
function openOptions(){

async function syncFromDrive(){
  driveBusy=true; updateDriveBtn();
  try{
    const remote=await driveLoadAll();
    const local=disk||{};
    const conflicts=[];
    for(const n of Object.keys(remote)){
      if(n in local&&local[n]!==remote[n]){
        const lh=VSLib.simpleHash(local[n]), rh=VSLib.simpleHash(remote[n]);
        if(lh!==rh){
          if(local[n].length>=remote[n].length){ disk[n]=local[n]; await driveSaveFile(n,local[n]); }
          else{
            const cn=n.replace(/\./,'')+'X.CIO';
            let i=1, fn=cn;
            while(disk[fn]){ fn=cn.slice(0,8)+i+++'.CIO'; }
            disk[fn]=local[n];
            disk[n]=remote[n];
            conflicts.push(n+'→'+fn);
          }
        }
      }
    }
    for(const n of Object.keys(remote))if(!(n in disk))disk[n]=remote[n];
    for(const n of Object.keys(local)){
      if(!(n in disk)){ disk[n]=local[n]; if(driveSyncEnabled(n))await driveSaveFile(n,local[n]); }
    }
    migrateDiskNames();
    await idbSaveAll(disk);
    if(VSF){ VSF.cfg.lastSyncAt=Date.now(); VSF.cfg.lastSyncErr=''; VSF.save(idbPutMeta); }
    if(conflicts.length)say('Conflitti: copie locali in '+conflicts.join(', '));
  }catch(e){
    if(VSF){ VSF.cfg.lastSyncErr=String(e.message||e); VSF.save(idbPutMeta); }
  }finally{ driveBusy=false; updateDriveBtn(); }
}

function diskNameFromFile(name){

function migrateDiskNames(){

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,IDB_VER);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'name'});
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});
      if(!db.objectStoreNames.contains('versions')){
        const vs=db.createObjectStore('versions',{keyPath:'id',autoIncrement:true});
        vs.createIndex('file','file',{unique:false});
      }
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function idbPutVersion(name,content,ts){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('versions','readwrite');
    tx.objectStore('versions').add({file:name,content,ts:ts||Date.now()});
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  }));
}
function idbListVersions(name){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('versions','readonly');
    const req=tx.objectStore('versions').index('file').getAll(name);
    req.onsuccess=()=>res((req.result||[]).sort((a,b)=>b.ts-a.ts));
    req.onerror=()=>rej(req.error);
  }));
}
function idbTrimVersions(name,keep){
  return idbListVersions(name).then(list=>{
    if(list.length<=keep)return;
    return idbOpen().then(db=>new Promise((res,rej)=>{
      const tx=db.transaction('versions','readwrite');
      const st=tx.objectStore('versions');
      list.slice(keep).forEach(v=>st.delete(v.id));
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
    }));
  });
}
function idbRestoreVersion(id){

function idbLoadAll(){

    req.onsuccess=()=>{
      const out={};
      (req.result||[]).forEach(row=>{ out[row.name]=row.content; });

const CRC32T=(()=>{
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[i]=c; }
  return t;
})();
function crc32(bytes){
  let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++)c=CRC32T[(c^bytes[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function u16(n){ return new Uint8Array([n&255,n>>>8]); }
function u32(n){ return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,n>>>24]); }
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[];
  let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=enc.encode(f.content), crc=crc32(data);
    const local=new Uint8Array(30+name.length+data.length);
    const dv=new DataView(local.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true); dv.setUint16(28,0,true);
    local.set(name,30); local.set(data,30+name.length);
    parts.push(local);
    const cen=new Uint8Array(46+name.length);
    const cv=new DataView(cen.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true);
    cv.setUint16(14,0,true); cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true);
    cv.setUint32(24,data.length,true); cv.setUint16(28,name.length,true); cv.setUint16(30,0,true);
    cv.setUint16(32,0,true); cv.setUint16(34,0,true); cv.setUint32(36,0,true); cv.setUint32(40,offset,true);
    cen.set(name,46);
    central.push(cen);
    offset+=local.length;
  });
  const centralSize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array(22);
  const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,centralSize,true); ev.setUint32(16,offset,true); ev.setUint16(20,0,true);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

function readU32(dv,o){ return dv.getUint32(o,true); }
function readU16(dv,o){ return dv.getUint16(o,true); }
async function importDiskBackup(file){
  await initDisk();
  const buf=await file.arrayBuffer(), dv=new DataView(buf);
  let pos=0, imported=0;
  while(pos+30<=buf.byteLength){
    if(readU32(dv,pos)!==0x04034b50)break;
    const comp=readU16(dv,pos+8), csize=readU32(dv,pos+18), nlen=readU16(dv,pos+26), xlen=readU16(dv,pos+28);
    const name=new TextDecoder().decode(new Uint8Array(buf,pos+30,nlen));
    const dataStart=pos+30+nlen+xlen;
    if(comp!==0||dataStart+csize>buf.byteLength)break;
    const content=new TextDecoder().decode(new Uint8Array(buf,dataStart,csize));
    const key=diskNameFromFile(name);
    disk[key]=content;
    imported++;
    pos=dataStart+csize;
  }
  if(!imported){ say('Backup non valido'); beep(); return; }
  await saveDisk();
  say('Ripristinati '+imported+' file');
}

function drawLimRows(){ return(isPortraitZoom()&&S.mode==='edit')?viewRows:ROWS; }
function ensureHScroll(){
  if(!isPortraitZoom()||S.mode!=='edit'){ viewHscroll=0; return; }
  if(S.col<viewHscroll)viewHscroll=Math.max(0,S.col-3);
  if(S.col>=viewHscroll+viewCols)viewHscroll=S.col-viewCols+4;
  viewHscroll=Math.max(0,Math.min(viewHscroll,COLS-viewCols));
}
function fit(){
  applyViewportLayout();
  const {W,H}=layoutSize();
  const probe=document.createElement('canvas').getContext('2d');
  probe.font='100px '+FONT;
  const m=probe.measureText('M');
  const cwu=m.width/100;
  const asc=m.actualBoundingBoxAscent||78, des=m.actualBoundingBoxDescent||22;
  const chu=Math.max((asc+des)/100*1.22,1.02);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  document.body.classList.toggle('portrait-zoom',isPortraitZoom());
  if(isPortraitZoom()){
    if(S.mode==='edit'){
      viewCols=Math.max(26,Math.min(44,Math.floor(W/10)));
      FS=Math.max(12,Math.floor(W/viewCols)-1);
      const fsc=(VSF&&VSF.cfg.fontScale)||1;
      FS=Math.max(10,Math.floor(FS*fsc));
      applyFont();
      CW=cx.measureText('M').width;
      CH=FS*chu;
      viewRows=Math.max(6,Math.floor(H/CH)-1);
      ensureHScroll();
      cv.width=Math.round(viewCols*CW*dpr); cv.height=Math.round(viewRows*CH*dpr);
      cv.style.width=Math.round(viewCols*CW)+'px'; cv.style.height=Math.round(viewRows*CH)+'px';
      cx.setTransform(dpr,0,0,dpr,0,0);
      applyFont();
      return;
    }
    viewCols=COLS; viewRows=ROWS; viewHscroll=0;
    FS=Math.max(6,Math.floor(W/(COLS*cwu))-1);
    applyFont();
    CW=cx.measureText('M').width;
    CH=FS*chu;
    cv.width=Math.round(COLS*CW*dpr); cv.height=Math.round(ROWS*CH*dpr);
    cv.style.width=Math.round(COLS*CW)+'px'; cv.style.height=Math.round(ROWS*CH)+'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
    applyFont();
    return;
  }
  viewCols=COLS; viewRows=ROWS; viewHscroll=0;
  FS=Math.max(5,Math.floor(Math.min(W/(COLS*cwu),H/(ROWS*chu)))-1);
  const fsc=(VSF&&VSF.cfg.fontScale)||1;
  FS=Math.max(5,Math.floor(FS*fsc));
  applyFont();
  CW=cx.measureText('M').width;
  CH=FS*chu;
  cv.width=Math.round(COLS*CW*dpr); cv.height=Math.round(ROWS*CH*dpr);
  cv.style.width=Math.round(COLS*CW)+'px'; cv.style.height=Math.round(ROWS*CH)+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
  applyFont();
}

function drawCell(c,r,ch,inv){
  const mc=drawLimCols(), mr=drawLimRows();

function padLine(parts){
  const total=parts.reduce((a,p)=>a+p.length,0);
  const gaps=parts.length-1, extra=COLS-total;
  if(gaps<=0||extra<0)return parts.join(' ').slice(0,COLS);
  const base=Math.floor(extra/gaps), rem=extra%gaps;
  let out='';
  parts.forEach((p,i)=>{ out+=p; if(i<gaps)out+=' '.repeat(base+(i<rem?1:0)); });
  return out;
}

/* ------------------------------ AUDIO (beep, tastiera, disk drive) ------------------------------ */
let AC=null;
function ensureAC(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){ return null; }
}
function beep(f,d){
  const ac=ensureAC(); if(!ac)return;
  const o=ac.createOscillator(),v=ac.createGain();
  o.type='square'; o.frequency.value=f||880; v.gain.value=0.03;
  o.connect(v); v.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+(d||0.06));
}
function playKeyClick(kind){
  if(!VSF||VSF.cfg.soundProfile==='silent'||!VSF.cfg.soundKeys)return;
  VSF.haptic(kind==='space'?12:8);
  const ac=ensureAC(); if(!ac)return;
  const mul=VSF.profileMul('key'), v=VSF.vol(1)*mul;
  const t=ac.currentTime;
  const out=ac.createGain();
  out.connect(ac.destination);
  const dur=kind==='space'?0.042:kind==='enter'?0.055:kind==='soft'?0.022:0.03;
  const pitch=kind==='space'?170:kind==='enter'?210:kind==='soft'?380:300+Math.random()*60;
  const nLen=Math.max(8,Math.floor(ac.sampleRate*0.009));
  const buf=ac.createBuffer(1,nLen,ac.sampleRate);
  const nd=buf.getChannelData(0);
  for(let i=0;i<nLen;i++)nd[i]=(Math.random()*2-1)*(1-i/nLen);
  const noise=ac.createBufferSource();
  noise.buffer=buf;
  const nF=ac.createBiquadFilter();
  nF.type='highpass'; nF.frequency.value=kind==='soft'?900:1400;
  const nG=ac.createGain();
  nG.gain.setValueAtTime((kind==='soft'?0.035:0.075)*v,t);
  nG.gain.exponentialRampToValueAtTime(0.001,t+0.014);
  noise.connect(nF); nF.connect(nG); nG.connect(out);
  noise.start(t); noise.stop(t+0.016);
  const osc=ac.createOscillator();
  osc.type='triangle';
  osc.frequency.setValueAtTime(pitch,t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(60,pitch*0.55),t+dur);
  const oG=ac.createGain();
  oG.gain.setValueAtTime((kind==='soft'?0.05:0.11)*v,t);
  oG.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(oG); oG.connect(out);
  osc.start(t); osc.stop(t+dur+0.01);
  if(kind==='normal'||kind==='special'){
    const ring=ac.createOscillator();
    ring.type='sine';
    ring.frequency.value=4100+Math.random()*900;
    const rG=ac.createGain();
    rG.gain.setValueAtTime(0.018*v,t);
    rG.gain.exponentialRampToValueAtTime(0.001,t+0.02);
    ring.connect(rG); rG.connect(out);
    ring.start(t); ring.stop(t+0.022);
  }
}
function playDiskDrive(mode){
  if(!VSF||!VSF.cfg.soundDisk||VSF.cfg.soundProfile==='silent')return;
  VSF.haptic(18);
  const ac=ensureAC(); if(!ac)return;
  const mul=VSF.profileMul('disk'), v=VSF.vol(0.38)*mul;
  const t=ac.currentTime;
  const out=ac.createGain();
  out.gain.value=v;
  out.connect(ac.destination);
  const seek=ac.createOscillator();
  seek.type='square';
  seek.frequency.setValueAtTime(mode==='read'?880:680,t);
  seek.frequency.linearRampToValueAtTime(360,t+0.09);
  const sG=ac.createGain();
  sG.gain.setValueAtTime(0.045,t);
  sG.gain.linearRampToValueAtTime(0.018,t+0.07);
  sG.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  seek.connect(sG); sG.connect(out);
  seek.start(t); seek.stop(t+0.15);
  const motor=ac.createOscillator();
  motor.type='sawtooth';
  motor.frequency.setValueAtTime(78,t+0.06);
  motor.frequency.setValueAtTime(92,t+0.28);
  const mG=ac.createGain();
  mG.gain.setValueAtTime(0,t+0.06);
  mG.gain.linearRampToValueAtTime(0.028,t+0.14);
  mG.gain.setValueAtTime(0.028,t+0.26);
  mG.gain.exponentialRampToValueAtTime(0.001,t+0.58);
  motor.connect(mG); mG.connect(out);
  motor.start(t+0.06); motor.stop(t+0.6);
  const bufLen=Math.floor(ac.sampleRate*0.38);
  const buf=ac.createBuffer(1,bufLen,ac.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufLen;i++){
    const env=i<bufLen*0.18?i/(bufLen*0.18):i>bufLen*0.82?(bufLen-i)/(bufLen*0.18):1;
    data[i]=(Math.random()*2-1)*env*0.35;
  }
  const rustle=ac.createBufferSource();
  rustle.buffer=buf;
  const rF=ac.createBiquadFilter();
  rF.type='bandpass'; rF.frequency.value=2400; rF.Q.value=1.4;
  const rG=ac.createGain();
  rG.gain.setValueAtTime(0,t+0.11);
  rG.gain.linearRampToValueAtTime(0.065,t+0.2);
  rG.gain.exponentialRampToValueAtTime(0.001,t+0.56);
  rustle.connect(rF); rF.connect(rG); rG.connect(out);
  rustle.start(t+0.11); rustle.stop(t+0.57);
  const clunk=ac.createOscillator();
  clunk.type='triangle';
  clunk.frequency.setValueAtTime(130,t+0.5);
  clunk.frequency.exponentialRampToValueAtTime(38,t+0.58);
  const cG=ac.createGain();
  cG.gain.setValueAtTime(0.09,t+0.5);
  cG.gain.exponentialRampToValueAtTime(0.001,t+0.62);
  clunk.connect(cG); cG.connect(out);
  clunk.start(t+0.5); clunk.stop(t+0.63);
}
function shouldPlayKeyClick(e){
  if(e.metaKey||e.key==='F12'||e.code==='F12')return false;
  if(e.key==='F11'||e.code==='F11')return false;
  if(!e.key&&!e.code)return false;
  return true;
}
function keyClickFor(e){
  const c=e.code||'';
  if(c==='Space'||e.key===' ')return playKeyClick('space');
  if(c==='Enter')return playKeyClick('enter');
  if(c==='Backspace'||c==='Delete')return playKeyClick('special');
  if(c.startsWith('Arrow')||c==='Tab'||c==='PageUp'||c==='PageDown'||c==='Home'||c==='End')return playKeyClick('soft');
  if(e.ctrlKey||e.altKey)return playKeyClick('soft');
  if(e.key&&e.key.length===1&&e.key>=' ')return playKeyClick('normal');
  if(e.key&&e.key.length===1)return playKeyClick('soft');
}
function playBootSound(){
  if(!VSF||!VSF.cfg.soundBoot||VSF.cfg.soundProfile==='silent')return;
  const ac=ensureAC(); if(!ac)return;
  const v=VSF.vol(0.04), t=ac.currentTime;
  [880,660,523].forEach((f,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(v,t+i*0.08);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.12);
    o.connect(g); g.connect(ac.destination);
    o.start(t+i*0.08); o.stop(t+i*0.08+0.14);
  });
}
function say(m){
  S.msg=m;
  const el=document.getElementById('sr-live');
  if(el&&m)el.textContent=m;
}

/* ------------------------------ UTILITA' CURSORE/TESTO ------------------------------ */
function cur(){ return {ln:S.ln,col:S.col}; }
function clampCursor(){
  if(S.ln<0)S.ln=0; if(S.ln>S.doc.length-1)S.ln=S.doc.length-1;
  const L=(S.doc[S.ln]||'').length;
  if(S.col<0)S.col=0; if(S.col>L)S.col=L; if(S.col>COLS-1)S.col=COLS-1;
}
function editTextTop(){ if(isPortraitZoom()&&S.mode==='edit')return 0; return Math.min(3,S.helpLevel)+(S.ruler?1:0); }
function textRows(){ if(isPortraitZoom()&&S.mode==='edit')return viewRows-2; return 24-editTextTop(); }
function ensureVisible(){
  const rows=textRows();
  if(S.ln<S.top)S.top=S.ln;
  if(S.ln>=S.top+rows)S.top=S.ln-rows+1;
  if(S.top<0)S.top=0;
  ensureHScroll();
}
function absPos(p){ let n=0; for(let i=0;i<p.ln;i++)n+=(S.doc[i]||'').length+1; return n+Math.min(p.col,(S.doc[p.ln]||'').length); }
function unabsPos(n){ for(let i=0;i<S.doc.length;i++){ const L=(S.doc[i]||'').length+1; if(n<L)return{ln:i,col:n}; n-=L; } const l=S.doc.length-1; return {ln:l,col:(S.doc[l]||'').length}; }
function normBlock(){
  if(!S.blk)return null;
  const a=S.blk.s,b=S.blk.e;
  const cmp=(p,q)=>p.ln-q.ln||p.col-q.col;
  return cmp(a,b)<=0?{a:{ln:a.ln,col:a.col},b:{ln:b.ln,col:b.col}}:{a:{ln:b.ln,col:b.col},b:{ln:a.ln,col:a.col}};
}
function blockText(){
  const n=normBlock(); if(!n)return[];
  const out=[];
  if(n.a.ln===n.b.ln)out.push((S.doc[n.a.ln]||'').slice(n.a.col,n.b.col));
  else{
    out.push((S.doc[n.a.ln]||'').slice(n.a.col));
    for(let l=n.a.ln+1;l<n.b.ln;l++)out.push(S.doc[l]||'');
    out.push((S.doc[n.b.ln]||'').slice(0,n.b.col));
  }
  return out;
}

/* ------------------------------ MOVIMENTO ------------------------------ */
function curLeft(){ if(S.col>0)S.col--; else if(S.ln>0){S.ln--;S.col=(S.doc[S.ln]||'').length;} }
function curRight(){ const L=(S.doc[S.ln]||'').length; if(S.col<L)S.col++; else if(S.ln<S.doc.length-1){S.ln++;S.col=0;} }
function curUp(){
  if(S.ln>S.top){ S.ln--; clampCursor(); return; }
  if(S.top>0)scroll(-1);
}
function curDown(){
  const rows=textRows();
  if(S.ln>=S.doc.length-1)return;
  if(S.ln<S.top+rows-1){ S.ln++; clampCursor(); return; }
  if(S.top+rows<S.doc.length)scroll(1);
  else{ S.ln++; clampCursor(); }
}
function wordLeft(){
  const line=S.doc[S.ln]||''; let i=S.col;
  if(i===0){ if(S.ln>0){S.ln--;S.col=(S.doc[S.ln]||'').length;} return; }
  i--; while(i>0&&line[i]===' ')i--;
  while(i>0&&line[i-1]!==' ')i--;
  S.col=i;
}
function wordRight(){
  const line=S.doc[S.ln]||''; let i=S.col;
  while(i<line.length&&line[i]!==' ')i++;
  while(i<line.length&&line[i]===' ')i++;
  if(i>=line.length&&S.ln<S.doc.length-1){S.ln++;S.col=0;} else S.col=i;
}
function selectWordAt(pos){
  const ln=pos?pos.ln:S.ln, col=pos?pos.col:S.col;
  const line=S.doc[ln]||'';
  if(!line.trim())return;
  let c=Math.min(col,line.length-1);
  if(c<0)c=0;
  while(c>0&&line[c-1]===' ')c--;
  if(c>=line.length||line[c]===' ')return;
  let a=c,b=c;
  while(a>0&&line[a-1]!==' ')a--;
  while(b<line.length&&line[b]!==' ')b++;
  S.blk={s:{ln,col:a},e:{ln,col:b}};
  S.blkVis=true;
  S.ln=ln; S.col=a;
  say('Parola selezionata');
}
function lineStart(){ S.col=0; }
function lineEnd(){ S.col=(S.doc[S.ln]||'').length; }
function screenTop(){ S.ln=S.top;S.col=0; }
function screenBot(){ S.ln=Math.min(S.top+textRows()-1,S.doc.length-1);S.col=0; }
function savePrev(){ S.prevPos=cur(); }
function gotoPos(p){ S.ln=p.ln;S.col=p.col;clampCursor();ensureVisible(); }
function docTop(){ savePrev(); S.ln=0;S.col=0;S.top=0; }
function docEnd(){ savePrev(); S.ln=S.doc.length-1;S.col=(S.doc[S.ln]||'').length; }
function gotoPrev(){ if(!S.prevPos){beep();return;} const t=cur(); gotoPos(S.prevPos); S.prevPos=t; }
function pageUp(){ const r=textRows()-1; S.top=Math.max(0,S.top-r); S.ln=Math.max(0,S.ln-r); clampCursor(); }
function pageDown(){ const r=textRows()-1; S.top=Math.min(Math.max(0,S.doc.length-1),S.top+r); S.ln=Math.min(S.doc.length-1,S.ln+r); clampCursor(); }
function scroll(d){
  const maxTop=Math.max(0,S.doc.length-1);
  S.top=Math.max(0,Math.min(maxTop,S.top+d));
  const rows=textRows();
  if(S.ln<S.top)S.ln=S.top;
  if(S.ln>=S.top+rows)S.ln=Math.min(S.doc.length-1,S.top+rows-1);
  clampCursor();
}
function placeCursorAt(clientX,clientY){
  const r=cv.getBoundingClientRect();
  if(isPortraitZoom()){
    const col=viewHscroll+Math.floor((clientX-r.left)/r.width*viewCols);
    const row=Math.floor((clientY-r.top)/r.height*viewRows);
    const rows=textRows();
    if(row>=0&&row<rows){
      const li=S.top+row;
      if(li>=0&&li<S.doc.length){ S.ln=li; S.col=Math.min(Math.max(col,0),(S.doc[li]||'').length); ensureVisible(); }
    }
  }else{
    const col=Math.floor((clientX-r.left)/r.width*COLS);
    const row=Math.floor((clientY-r.top)/r.height*ROWS);
    const top=editTextTop();
    if(row>=top&&row<24){
      const li=S.top+(row-top);
      if(li>=0&&li<S.doc.length){ S.ln=li; S.col=Math.min(Math.max(col,0),(S.doc[li]||'').length); ensureVisible(); }
    }
  }
}

/* ------------------------------ EDITING ------------------------------ */
function pushUndo(){
  S.redoStack.length=0;
  S.undoStack.push({doc:S.doc.slice(),ln:S.ln,col:S.col});
  if(S.undoStack.length>200)S.undoStack.shift();
}
function undo(){
  const u=S.undoStack.pop();
  if(!u){beep();return;}
  S.redoStack.push({doc:S.doc.slice(),ln:S.ln,col:S.col});
  S.doc=u.doc;S.ln=u.ln;S.col=u.col;markDirty();clampCursor();ensureVisible();say('Annullato');
}
function redo(){
  const r=S.redoStack.pop();
  if(!r){beep();return;}
  S.undoStack.push({doc:S.doc.slice(),ln:S.ln,col:S.col});
  S.doc=r.doc;S.ln=r.ln;S.col=r.col;markDirty();clampCursor();ensureVisible();
  say(typeof VSExt!=='undefined'?VSExt.t('redo'):'Ripristinato');
}
function refreshSpellMarks(){
  if(typeof VSExt==='undefined')return;
  const set=VSExt.buildSpellSet(VSF.cfg);
  S.spellMarks=VSExt.findSpellMarks(S.doc,set);
  S.spellPos=0;
}
function gotoNextSpell(){
  if(!S.spellMarks||!S.spellMarks.length){ say('SpellStar: OK'); return; }
  const m=VSExt.nextSpellMark(S.spellMarks,{ln:S.ln,col:S.col+1});
  if(!m){ say('SpellStar: fine lista'); return; }
  S.ln=m.ln; S.col=m.start; ensureVisible();
  const set=VSExt.buildSpellSet(VSF.cfg);
  const sug=VSExt.suggestWords(m.word,set,3);
  const hint=sug.length?'  ['+sug.map((w,i)=>(i+1)+':'+w).join(' ')+']':'';
  say('SpellStar: '+m.word+hint+' (1-3 sostituisci, A ignora, F7 prossimo)');
}
function replaceSpellWord(replacement){
  if(!S.spellMarks||!S.spellMarks.length)return;
  const m=VSExt.nextSpellMark(S.spellMarks,{ln:S.ln,col:S.col});
  if(!m)return;
  pushUndo();
  const line=S.doc[m.ln]||'';
  S.doc[m.ln]=line.slice(0,m.start)+replacement+line.slice(m.end);
  if(S.ln===m.ln&&S.col>=m.start)S.col+=replacement.length-(m.end-m.start);
  markDirty(); refreshSpellMarks(); gotoNextSpell();
}
function ignoreSpellWord(){
  if(!S.spellMarks||!S.spellMarks.length)return;
  const m=VSExt.nextSpellMark(S.spellMarks,{ln:S.ln,col:S.col});
  if(m){ VSExt.addUserWord(VSF.cfg,m.word); VSF.save(idbPutMeta); refreshSpellMarks(); gotoNextSpell(); }
}
function runMacro(){
  const t=VSF&&VSF.cfg.macroText;
  if(!t){ say('Macro non impostata (Opzioni)'); beep(); return; }
  if(S.mode!=='edit'){ say('Apri un documento'); beep(); return; }
  pushUndo();
  insertTextRaw(t);
  markDirty();
  ensureVisible();
  say(typeof VSExt!=='undefined'?VSExt.t('macroRun'):'Macro eseguita');
}
function isSpellCell(ln,c){
  if(!S.spellMarks)return false;
  for(let i=0;i<S.spellMarks.length;i++){
    const m=S.spellMarks[i];
    if(m.ln===ln&&c>=m.start&&c<m.end)return true;
  }
  return false;
}
function wrapLine(li){
  const line=S.doc[li]||'', rm=getRM();
  if(line.length<=rm)return;
  let sp=-1;
  for(let i=Math.min(rm,line.length-1);i>=0;i--){ if(line[i]===' '){sp=i;break;} }
  if(sp<=0){
    if(line.length>=COLS){ S.doc[li]=line.slice(0,COLS-1); if(S.ln===li&&S.col>COLS-1)S.col=COLS-1; }
    return;
  }
  const head=line.slice(0,sp), tail=line.slice(sp+1);
  S.doc[li]=head;
  let added=0;
  if(li+1<S.doc.length&&(S.doc[li+1]||'').trim()!==''){
    const sep=(S.doc[li+1]||'').startsWith(' ')?'':' ';
    S.doc[li+1]=tail+sep+S.doc[li+1];
    added=tail.length+sep.length;
  }else{
    S.doc.splice(li+1,0,tail);
  }
  if(S.ln===li&&S.col>sp){ S.ln=li+1; S.col-=sp+1; }
  else if(S.ln===li+1){ S.col+=added; }
  if((S.doc[li+1]||'').length>getRM())wrapLine(li+1);
}
function typeChar(ch){
  let line=S.doc[S.ln]||'';
  if(!S.ins&&S.col<line.length)line=line.slice(0,S.col)+ch+line.slice(S.col+1);
  else line=line.slice(0,S.col)+ch+line.slice(S.col);
  S.col++;
  S.doc[S.ln]=line;
  if(S.wrapOn)wrapLine(S.ln);
  markDirty();
}
function insertChar(ch){ pushUndo(); typeChar(ch); ensureVisible(); }
function backspace(){
  pushUndo();
  if(S.col>0){
    const line=S.doc[S.ln]||'';
    S.doc[S.ln]=line.slice(0,S.col-1)+line.slice(S.col);
    S.col--;
  }else if(S.ln>0){
    const prev=S.doc[S.ln-1]||'';
    S.col=prev.length;
    S.doc[S.ln-1]=prev+(S.doc[S.ln]||'');
    S.doc.splice(S.ln,1);
    S.ln--;
    if(S.wrapOn)wrapLine(S.ln);
  }
  markDirty(); ensureVisible();
}
function delChar(){
  pushUndo();
  const line=S.doc[S.ln]||'';
  if(S.col<line.length)S.doc[S.ln]=line.slice(0,S.col)+line.slice(S.col+1);
  else if(S.ln<S.doc.length-1){ S.doc[S.ln]=line+S.doc[S.ln+1]; S.doc.splice(S.ln+1,1); if(S.wrapOn)wrapLine(S.ln); }
  markDirty(); ensureVisible();
}
function delWord(){
  pushUndo();
  const line=S.doc[S.ln]||'';
  const seg=line.slice(S.col);
  if(seg.trim()===''&&S.ln<S.doc.length-1){
    S.doc[S.ln]=line.slice(0,S.col)+S.doc[S.ln+1];
    S.doc.splice(S.ln+1,1);
  }else{
    let i=S.col;
    while(i<line.length&&line[i]!==' ')i++;
    while(i<line.length&&line[i]===' ')i++;
    S.doc[S.ln]=line.slice(0,S.col)+line.slice(i);
  }
  markDirty(); ensureVisible();
}
function delLine(){
  pushUndo();
  S.doc.splice(S.ln,1);
  if(!S.doc.length)S.doc=[''];
  S.col=0; clampCursor(); markDirty(); ensureVisible();
}
function newPara(){ pushUndo(); newParaRaw(); markDirty(); ensureVisible(); }
function newParaRaw(){
  const line=S.doc[S.ln]||'';
  const rest=line.slice(S.col);
  S.doc[S.ln]=line.slice(0,S.col).replace(/\s+$/,'');
  S.doc.splice(S.ln+1,0,rest);
  S.ln++;S.col=0;
}
function blankLine(){ pushUndo(); S.doc.splice(S.ln,0,''); S.col=0;markDirty();ensureVisible(); }
function insertTab(){ pushUndo(); const n=8-(S.col%8)||8; for(let i=0;i<n;i++)typeChar(' '); ensureVisible(); }
function toggleIns(){ S.ins=!S.ins; say(S.ins?'INSERIMENTO':'SOVRASCRITTURA'); }
function reformat(){
  pushUndo();
  let s=S.ln; while(s>0&&(S.doc[s-1]||'').trim()!=='')s--;
  let e=S.ln; while(e<S.doc.length-1&&(S.doc[e+1]||'').trim()!=='')e++;
  const words=S.doc.slice(s,e+1).map(t=>t.trim()).filter(Boolean).join(' ');
  const out=[]; let line=''; const rm=getRM();
  for(const w of words.split(/\s+/)){
    if(!w)continue;
    if(!line)line=w;
    else if((line+' '+w).length<=rm)line+=' '+w;
    else{ out.push(line); line=w; }
    while(line.length>rm){ out.push(line.slice(0,rm)); line=line.slice(rm); }
  }
  out.push(line);
  S.doc.splice(s,e-s+1,...out);
  S.ln=s;S.col=0;markDirty();ensureVisible();
  say('Paragrafo riformattato');
}
function insertTextRaw(t){
  for(const ch of t){
    if(ch==='\n')newParaRaw();
    else if(ch!=='\r'&&ch>=' ')typeChar(ch);
  }
}
function insertLines(lines){
  pushUndo();
  const full=S.doc.join('\n');
  const c=absPos(cur());
  const text=lines.join('\n');
  S.doc=(full.slice(0,c)+text+full.slice(c)).split('\n');
  const p=unabsPos(c+text.length); S.ln=p.ln;S.col=p.col;
  markDirty(); ensureVisible();
}

/* ------------------------------ BLOCCHI ------------------------------ */
function blockOp(kind){
  const n=normBlock();
  if(!n){ say('Nessun blocco marcato'); beep(); return; }
  pushUndo();
  const full=S.doc.join('\n');
  const a=absPos(n.a), b=absPos(n.b);
  const text=full.slice(a,b);
  const c0=absPos(cur());
  if(kind==='del'){
    const nc=c0>b?c0-(b-a):(c0>=a?a:c0);
    S.doc=(full.slice(0,a)+full.slice(b)).split('\n');
    const p=unabsPos(nc); S.ln=p.ln;S.col=p.col;
    say('Blocco cancellato');
  }else if(kind==='move'){
    const rest=full.slice(0,a)+full.slice(b);
    const c=c0>b?c0-(b-a):(c0>=a?a:c0);
    S.doc=(rest.slice(0,c)+text+rest.slice(c)).split('\n');
    const p=unabsPos(c+text.length); S.ln=p.ln;S.col=p.col;
    say('Blocco spostato');
  }else{
    S.doc=(full.slice(0,c0)+text+full.slice(c0)).split('\n');
    const p=unabsPos(c0+text.length); S.ln=p.ln;S.col=p.col;
    say('Blocco copiato');
    try{ if(navigator.clipboard)navigator.clipboard.writeText(text.replace(/\n/g,'\r\n')).catch(()=>{}); }catch(e){}
  }
  markDirty(); clampCursor(); ensureVisible();
}

/* ------------------------------ CERCA / SOSTITUISCI ------------------------------ */
function findNext(q,from){
  const full=S.doc.join('\n').toLowerCase();
  const ql=q.toLowerCase();
  let i=full.indexOf(ql,Math.min(absPos(from)+1,full.length));
  if(i<0)i=full.indexOf(ql);
  if(i<0)return null;
  return unabsPos(i);
}
function doFind(){
  ask('Cercare? ',q=>{
    S.lastFind=q;
    const p=findNext(q,cur());
    if(!p){ say('"'+q+'" non trovato'); beep(); }
    else{ savePrev(); gotoPos(p); say(''); }
  },{def:S.lastFind});
}
function repeatFind(){
  if(!S.lastFind){ say('Nessuna ricerca precedente'); beep(); return; }
  const p=findNext(S.lastFind,cur());
  if(p){ savePrev(); gotoPos(p); } else { say('Non trovato'); beep(); }
}
function doReplaceAt(p,q,r){
  const a=absPos(p);
  const full=S.doc.join('\n');
  S.doc=(full.slice(0,a)+r+full.slice(a+q.length)).split('\n');
  const np=unabsPos(a+r.length); S.ln=np.ln;S.col=np.col;
  markDirty();
}
function doReplaceAsk(){
  ask('Sostituire? ',q=>{
    S.lastFind=q;
    ask('Con cosa? ',r=>{ S.lastRepl=r; replaceStep(q,r,false); },{def:S.lastRepl});
  },{def:S.lastFind});
}
function replaceStep(q,r,all){
  const p=findNext(q,cur());
  if(!p){ say('Altre occorrenze non trovate'); return; }
  gotoPos(p);
  if(all){ doReplaceAt(p,q,r); replaceStep(q,r,true); return; }
  askYN('Sostituire? ',ans=>{
    if(ans==='all'){ doReplaceAt(p,q,r); replaceStep(q,r,true); }
    else if(ans){ doReplaceAt(p,q,r); replaceStep(q,r,false); }
    else replaceStep(q,r,false);
  },{all:true});
}

/* ------------------------------ PROMPT (riga messaggi) ------------------------------ */
function ask(label,cb,opt){ S.prompt={type:'text',label,value:(opt&&opt.def)||'',cb,opt:opt||{}}; }
function askYN(label,cb,opt){ S.prompt={type:'yn',label,cb,all:!!(opt&&opt.all)}; }
function askName(label,cb,isDoc){ ask(label,v=>{ const n=normDiskName(v,isDoc); if(!n){beep();return;} cb(n); },{upper:true,filter:/[^A-Z0-9._\-]/,max:12}); }
function askLevel(){ ask('Livello di aiuto (0-3)? ',v=>{ const n=parseInt(v,10); if(n>=0&&n<=3){S.helpLevel=n;say('Livello di aiuto '+n);}else{say('Livello non valido');beep();} },{filter:/[^0-9]/,max:1}); }
function promptText(){ const p=S.prompt; return p.type==='yn'?p.label+(p.all?'(S/N/T) ':'(S/N) '):p.label+p.value; }
function handlePrompt(e){
  const p=S.prompt;
  if(e.code==='Escape'){ S.prompt=null; say(''); return; }
  if(p.type==='yn'){
    const k=(e.key||'').toLowerCase();
    if(k==='s'||k==='y'){ S.prompt=null; p.cb(true); }
    else if(k==='n'){ S.prompt=null; p.cb(false); }
    else if((k==='t'||k==='a')&&p.all){ S.prompt=null; p.cb('all'); }
    else if(e.code==='Enter'){ S.prompt=null; p.cb(false); }
    else beep();
    return;
  }
  if(e.code==='Enter'){
    const v=p.value||p.opt.def||'';
    if(!v){ beep(); return; }
    S.prompt=null; p.cb(v); return;
  }
  if(e.code==='Backspace'){ p.value=p.value.slice(0,-1); return; }
  const k=e.key;
  if(!e.ctrlKey&&!e.altKey&&k&&k.length===1&&k>=' '){
    let ch=p.opt.upper?k.toUpperCase():k;
    if(p.opt.filter)ch=ch.replace(p.opt.filter,'');
    if(ch&&p.value.length<(p.opt.max||60))p.value+=ch;
  }
}

/* ------------------------------ FILE: salva/apri/stampa ------------------------------ */
function checkUnsaved(then){
  if(S.mode==='edit'&&S.dirty&&S.filename){
    askYN('Salvare '+S.filename+' prima di continuare? ',ans=>{
      if(ans){ doSave(true); clearDirtyUI(); then(); }
      else{ S.dirty=false; clearDirtyUI(); then(); }
    });
  }else then();
}
function openFile(name,isDoc){
  const n=normDiskName(name,isDoc);
  const exists=n in disk;
  if(exists)playDiskDrive('read');
  S.filename=n;
  S.wrapOn=isDoc;
  S.doc=exists?(disk[n]||'').split(/\r?\n/):[''];
  if(!S.doc.length)S.doc=[''];
  S.ln=0;S.col=0;S.top=0;S.blk=null;S.blkVis=true;S.dirty=false;
  clearDirtyUI();
  S.undoStack.length=0;S.redoStack.length=0;S.prevPos=null;S.markers=new Array(10).fill(null);S.pending=null;
  S.mode='edit';
  if(VSF){ VSF.pushRecent(n); VSF.save(idbPutMeta); }
  refreshSpellMarks();
  say(exists?'Aperto '+n:'Nuovo file '+n);
  requestAnimationFrame(fit);
}
function openFileSafe(name,isDoc){ checkUnsaved(()=>openFile(name,isDoc)); }
async function doSave(silent){
  if(!S.filename)return;
  if(!silent)playDiskDrive('write');
  const content=S.doc.join('\r\n');
  if(VSF)await VSF.saveVersion(idbPutVersion,S.filename,content,VSF.cfg.versionKeep);
  disk[S.filename]=content;
  saveDiskFile(S.filename);
  writeExternalIfLinked(S.filename);
  S.dirty=false;
  clearDirtyUI();
  if(!silent)say('Salvato '+S.filename);
}
function saveFile(next){
  const finish=()=>{ if(next==='open')S.mode='open'; else if(next==='exit')S.mode='exit'; };
  if(!S.filename){ askName('Salvare come? ',n=>{ S.filename=n; doSave(); finish(); },true); return; }
  doSave(); finish();
}
function abandon(){
  if(S.dirty)askYN('Abbandonare le modifiche a '+S.filename+'? ',y=>{ if(y){S.dirty=false;clearDirtyUI();S.mode='open';say('');} });
  else{ S.mode='open'; say(''); }
}
function noFile(n){ say(n+': file non trovato'); beep(); }
function printFile(n){
  if(!(n in disk))return noFile(n);
  say('S=Stampa  N=Esporta  (usa prompt S/N)');
  askYN('Stampare '+n+'? ',y=>{
    if(y){ VSF.printDocument(n,disk[n],FONT.replace(/"/g,'')); say('Anteprima stampa/PDF'); }
    else{ say('Esportazione di '+n+' ...'); exportViaFSA(n); }
  });
}
function runSpellStar(){
  askName('Controllare ortografia di quale file? ',n=>{
    if(!(n in disk))return noFile(n);
    if(S.mode==='edit'&&S.filename===n){ refreshSpellMarks(); gotoNextSpell(); return; }
    const set=VSExt.buildSpellSet(VSF.cfg);
    const bad=VSExt.findSpellMarks((disk[n]||'').split('\n'),set);
    if(!bad.length)say('SpellStar: nessun errore rilevato');
    else say('SpellStar: '+bad.length+' errori — apri il file e premi F7');
  },true);
}
function runMailMerge(){
  askName('File modello (con {CAMPO})? ',tpl=>{
    if(!(tpl in disk))return noFile(tpl);
    askName('File dati CSV? ',dat=>{
      if(!(dat in disk))return noFile(dat);
      const merged=VSLib.mergeAll(disk[tpl],disk[dat]);
      if(!merged.length){ say('Nessuna riga dati'); beep(); return; }
      mergePreview={merged,idx:0,tpl,dat};
      S.mode='mergepreview';
    },true);

}
function finishMailMerge(prefix){
  if(!mergePreview)return;
  const base=(prefix||'OUT').toUpperCase().replace(/[^A-Z0-9._\-]/g,'').slice(0,8);
  mergePreview.merged.forEach((m,i)=>{
    const fn=(base+String(i+1).padStart(2,'0')).slice(0,8)+EXT;
    disk[fn]=m.content;
  });
  const n=mergePreview.merged.length;
  mergePreview=null;
  S.mode='open';
  saveDisk().then(()=>say('MailMerge: '+n+' file creati'));
}
function restoreFileVersion(){

function showWordCount(){

/* ------------------------------ SOTTOMENU ^K ^Q ^O ------------------------------ */
function handleK(ch){
  const u=(ch||'').toUpperCase();
  if(/^[0-9]$/.test(ch)){ S.markers[+ch]=cur(); say('Marcatore '+ch+' impostato'); return; }
  switch(u){
    case 'B': S.blk={s:cur(),e:cur()}; say('Inizio blocco marcato'); break;
    case 'K': if(!S.blk){say('Nessun inizio blocco');beep();}else{S.blk.e=cur();say('Fine blocco marcata');} break;
    case 'C': blockOp('copy'); break;
    case 'V': blockOp('move'); break;
    case 'Y': blockOp('del'); break;
    case 'H': S.blkVis=!S.blkVis; say(S.blkVis?'Blocco visibile':'Blocco nascosto'); break;
    case 'W': if(!normBlock()){say('Nessun blocco marcato');beep();}else askName('Scrivere blocco nel file? ',n=>{ disk[n]=blockText().join('\r\n'); saveDisk(); say('Blocco scritto su '+n); }); break;
    case 'R': askName('Leggere quale file? ',n=>{ if(!(n in disk))return noFile(n); insertLines((disk[n]||'').split(/\r?\n/)); say(n+' inserito'); }); break;
    case 'S': saveFile('cont'); break;
    case 'T': askName('Salvare come? ',n=>{ S.filename=n; doSave(); },true); break;
    case 'D': saveFile('open'); break;
    case 'X': saveFile('exit'); break;
    case 'Q': abandon(); break;
    default: beep();
  }
}
function handleQ(ch){
  const u=(ch||'').toUpperCase();
  if(/^[0-9]$/.test(ch)){ const m=S.markers[+ch]; if(m){savePrev();gotoPos(m);say('Marcatore '+ch);}else{say('Marcatore non impostato');beep();} return; }
  switch(u){
    case 'S': lineStart(); break;
    case 'D': lineEnd(); break;
    case 'E': screenTop(); break;
    case 'X': screenBot(); break;
    case 'R': docTop(); break;
    case 'C': docEnd(); break;
    case 'W': scroll(-1); break;
    case 'Z': scroll(1); break;
    case 'N': showWordCount(); break;
    case 'P': gotoPrev(); break;
    case 'B': { const b=normBlock(); if(b){savePrev();gotoPos(b.a);}else beep(); break; }
    case 'K': { const b=normBlock(); if(b){savePrev();gotoPos(b.b);}else beep(); break; }
    case 'F': doFind(); break;
    case 'A': doReplaceAsk(); break;
    case 'Y': redo(); break;
    case 'M': runMacro(); break;
    default: beep();
  }
}
function handleO(ch){
  const u=(ch||'').toUpperCase();
  if(u==='R'){ S.ruler=!S.ruler; say('Righello '+(S.ruler?'ON':'OFF')); }
  else if(u==='W'){ S.wrapOn=!S.wrapOn; say('A capo automatico '+(S.wrapOn?'ON':'OFF')); }
  else if(u==='I'){ askLevel(); }
  else beep();
}
function ctrlCmd(L){
  switch(L){
    case 'S': curLeft(); break;
    case 'D': curRight(); break;
    case 'E': curUp(); break;
    case 'X': curDown(); break;
    case 'A': wordLeft(); break;
    case 'F': wordRight(); break;
    case 'W': scroll(-1); break;
    case 'Z': scroll(1); break;
    case 'R': pageUp(); break;
    case 'C': pageDown(); break;
    case 'G': openHelp(); break;
    case 'J': askLevel(); break;
    case 'O': S.pending='O'; say(OMENU); break;
    case 'K': S.pending='K'; say(KMENU); break;
    case 'Q': S.pending='Q'; say(QMENU); break;
    case 'T': delWord(); break;
    case 'Y': delLine(); break;
    case 'U': undo(); break;
    case 'V': toggleIns(); break;
    case 'B': reformat(); break;
    case 'N': blankLine(); break;
    case 'H': backspace(); break;
    case 'M': newPara(); break;
    case 'L': repeatFind(); break;
    default: beep(); say('Comando inesistente');
  }
}

function openHelp(){ S.helpFrom=S.mode; S.helpPage=0; S.mode='help'; }
function keyHelp(e){
  if(e.code==='Escape'){ S.mode=S.helpFrom; return; }
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'||e.code==='PageDown'){
    S.helpPage++;
    if(S.helpPage>=HELP_PAGES.length)S.mode=S.helpFrom;
  }else if(e.code==='ArrowUp'||e.code==='PageUp'||e.code==='Backspace'){
    S.helpPage=Math.max(0,S.helpPage-1);
  }
}

/* ------------------------------ SHELL DOS (^R) ------------------------------ */
function startDos(){
  S.dosFrom=S.mode; S.mode='dos'; S.dosInput='';
  S.dosLines=['SHELL DOS DI VaaardStar (simulata)','','Digita HELP per i comandi, EXIT per tornare a VaaardStar.',''];
}
function keyDos(e){
  if(e.code==='Escape'){ S.mode=S.dosFrom; return; }
  if(e.code==='Enter'){ dosExec(S.dosInput); S.dosInput=''; return; }
  if(e.code==='Backspace'){ S.dosInput=S.dosInput.slice(0,-1); return; }
  const k=e.key;
  if(!e.ctrlKey&&!e.altKey&&k&&k.length===1&&k>=' ')S.dosInput+=k;
}
function dosExec(inp){
  const parts=inp.trim().split(/\s+/);
  const cmd=(parts[0]||'').toUpperCase();
  const push=s=>S.dosLines.push(s);
  push('C:\\WS>'+inp);
  switch(cmd){
    case '': break;
    case 'HELP': push('Comandi: DIR TYPE n CLS VER ECHO t REN a b COPY a b DEL n EXIT'); break;
    case 'VER': push('MS-DOS versione 4.01 (simulata)'); break;
    case 'CLS': S.dosLines=[]; break;
    case 'EXIT': S.mode=S.dosFrom; break;
    case 'DIR':
      push(' Directory di A:\\'); push('');
      Object.keys(disk).sort().forEach(n=>push('  '+n.padEnd(14)+String((disk[n]||'').length).padStart(6)+'  19-08-26'));
      push(''); push('  '+Object.keys(disk).length+' file');
      break;
    case 'TYPE': { const n=(parts[1]||'').toUpperCase(); if(!(n in disk)){push('File non trovato');break;} (disk[n]||'').split(/\r?\n/).slice(0,60).forEach(l=>push(l.slice(0,COLS))); break; }
    case 'REN': { const a=(parts[1]||'').toUpperCase(),b=(parts[2]||'').toUpperCase(); if(!(a in disk))push('File non trovato'); else if(!b||b in disk)push('Nome file duplicato'); else{disk[b]=disk[a];delete disk[a];saveDisk();} break; }
    case 'COPY': { const a=(parts[1]||'').toUpperCase(),b=(parts[2]||'').toUpperCase(); if(!(a in disk))push('File non trovato'); else if(!b||b in disk)push('Nome file duplicato'); else{disk[b]=disk[a];saveDisk();push(' 1 file copiato');} break; }
    case 'DEL': case 'ERASE': { const a=(parts[1]||'').toUpperCase(); if(!(a in disk))push('File non trovato'); else{delete disk[a];saveDisk();} break; }
    case 'ECHO': push(parts.slice(1).join(' ')); break;
    default: push('Comando o file non trovato');
  }
  if(S.dosLines.length>200)S.dosLines=S.dosLines.slice(-200);
}

function fmtSize(n){ return n>=1024?(n/1024).toFixed(1)+'K':n+'B'; }
function dateStr(){
  const d=new Date();
  const mo=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'][d.getMonth()];
  return ('0'+d.getDate()).slice(-2)+'-'+mo+'-'+d.getFullYear();
}
function keyOpen(e){
  if(e.code==='F1'){ openHelp(); return; }
  if(e.code==='PageUp'){ filePageOpen=Math.max(0,filePageOpen-1); return; }
  if(e.code==='PageDown'){
    const p=Math.max(1,Math.ceil(Object.keys(disk||{}).length/FILES_PER_OPEN));
    filePageOpen=Math.min(p-1,filePageOpen+1); return;
  }
  if(e.ctrlKey)return;
  const k=(e.key||'').toLowerCase();
  switch(k){
    case 'd': askName('Nome del file da modificare? ',n=>openFileSafe(n,true),true); break;
    case 'n': askName('Nome del non-documento? ',n=>openFileSafe(n,false),false); break;
    case 'f': S.mode='dir'; break;
    case 'e': askName('Rinominare quale file? ',a=>{ if(!(a in disk))return noFile(a);
        askName('Nuovo nome? ',b=>{ if(b in disk)return say('File gia\' esistente');
          storageRenameFile(a,b).then(()=>say(a+' rinominato in '+b)); }); }); break;
    case 'o': askName('Copiare quale file? ',a=>{ if(!(a in disk))return noFile(a);
        askName('Destinazione? ',b=>{ if(b in disk)return say('File gia\' esistente'); disk[b]=disk[a]; saveDisk(); say(a+' copiato in '+b); }); }); break;
    case 'y': askName('Cancellare quale file? ',a=>{ if(!(a in disk))return noFile(a);
        askYN('Cancellare '+a+'? ',y=>{ if(y)storageDeleteFile(a).then(()=>say(a+' cancellato')); }); }); break;
    case 'p': askName('Esportare quale file? ',a=>{ if(!(a in disk))return noFile(a); printFile(a); },true); break;
    case 'i': importViaFSA(true); break;
    case 'b': exportDiskBackup(); break;
    case 'u': importBackupPicker(); break;
    case 'v': openOptions(); break;
    case 'h': askLevel(); break;
    case 'r': startDos(); break;
    case 'l': say('Drive corrente: A:'); break;
    case 'm': runMailMerge(); break;
    case 's': runSpellStar(); break;
    case 'x': askYN('Uscire da VaaardStar? ',y=>{ if(y)S.mode='exit'; }); break;
    default: if(k.length===1&&k>=' ')beep();
  }
}
function keyDir(e){
  if(e.code==='PageUp'){ filePageDir=Math.max(0,filePageDir-1); return; }
  if(e.code==='PageDown'){
    const p=Math.max(1,Math.ceil(Object.keys(disk||{}).length/FILES_PER_DIR));
    filePageDir=Math.min(p-1,filePageDir+1); return;
  }
  if(e.code==='Escape'){ S.mode='open'; return; }
  if(e.ctrlKey)return;
  const k=(e.key||'').toLowerCase();
  if(k.length===1&&k>=' ')beep();
}

/* ------------------------------ TASTIERA: EDITOR ------------------------------ */
function keyEdit(e){
  const k=e.key, ctrl=e.ctrlKey&&!e.metaKey;
  const letter=(e.code&&e.code.indexOf('Key')===0)?e.code.slice(3):null;
  if(S.pending){
    const p=S.pending; S.pending=null;
    if(e.code!=='Escape'){
      const ch=(k&&k.length===1)?k:'';
      if(p==='K')handleK(ch); else if(p==='Q')handleQ(ch); else if(p==='O')handleO(ch);
    }
    return;
  }
  switch(e.code){
    case 'F1': openHelp(); return;
    case 'F2': saveFile('cont'); return;
    case 'F3': doFind(); return;
    case 'F4': doReplaceAsk(); return;
    case 'F7': gotoNextSpell(); return;
    case 'F8': runMacro(); return;
    case 'ArrowLeft': curLeft(); return;
    case 'ArrowRight': curRight(); return;
    case 'ArrowUp': curUp(); return;
    case 'ArrowDown': curDown(); return;
    case 'PageUp': pageUp(); return;
    case 'PageDown': pageDown(); return;
    case 'Home': ctrl?docTop():lineStart(); return;
    case 'End': ctrl?docEnd():lineEnd(); return;
    case 'Insert': toggleIns(); return;
    case 'Delete': delChar(); return;
    case 'Backspace': ctrl?delWord():backspace(); return;
    case 'Enter': newPara(); return;
    case 'Tab': insertTab(); return;
    case 'Escape': S.msg=''; return;
  }
  if(!ctrl&&!e.altKey&&(k==='a'||k==='A')&&S.spellMarks&&S.spellMarks.length){ ignoreSpellWord(); return; }
  if(!ctrl&&!e.altKey&&S.spellMarks&&S.spellMarks.length&&/^[1-3]$/.test(k)){
    const set=VSExt.buildSpellSet(VSF.cfg);
    const m=VSExt.nextSpellMark(S.spellMarks,{ln:S.ln,col:S.col});
    if(m){
      const sug=VSExt.suggestWords(m.word,set,3);
      const rep=sug[+k-1];
      if(rep){ replaceSpellWord(rep); return; }
    }
  }
  if(ctrl&&letter){ ctrlCmd(letter); return; }
  if(!ctrl&&!e.altKey&&k&&k.length===1&&k>=' '){ insertChar(k); return; }
}

/* ------------------------------ DISEGNO SCHERMATE ------------------------------ */
function statusStr(){
  const unsaved=S.dirty?(typeof VSExt!=='undefined'?VSExt.t('unsaved'):'* NON SALVATO '):'';
  const fn=S.filename?(unsaved+S.filename+'  '):'';
  return fn+'Col '+(S.col+1)+'  Rg '+(S.ln+1)+'  Pg '+(Math.floor(S.ln/PAGE_LEN)+1);
}
function bottomLine(showStatus){
  const left=S.prompt?promptText():S.msg;
  drawTxt(24,0,(left||'').slice(0,62));
  if(S.prompt&&S.prompt.type==='text'&&blinkOn)drawCell(Math.min((left||'').length,79),24,' ',true);
  if(showStatus){
    const st=statusStr();
    if(!S.prompt||(left||'').length+2+st.length<=COLS)drawTxt(24,COLS-st.length,st);
  }
}
function drawEdit(){
  if(isPortraitZoom()){ drawEditZoom(); return; }
  const M=menuLines();
  let r=0;
  for(let i=0;i<Math.min(3,S.helpLevel);i++)drawTxt(r++,0,M[i]);
  if(S.ruler&&r<24)drawTxt(r++,0,RULER);
  const rows=24-r;
  ensureVisible();
  const blk=normBlock();
  for(let i=0;i<rows;i++){
    const li=S.top+i;
    const s=(S.doc[li]!==undefined?S.doc[li]:'').slice(0,COLS);
    drawTxt(r+i,0,s.padEnd(COLS));
    if(S.spellMarks){ for(let c=0;c<s.length;c++)if(isSpellCell(li,c))drawCell(c,r+i,s[c],true); }
    if(blk&&S.blkVis){
      let a=-1,b=-1;
      if(li>blk.a.ln&&li<blk.b.ln){a=0;b=COLS;}
      else if(li===blk.a.ln){a=blk.a.col;b=(li===blk.b.ln)?blk.b.col:COLS;}
      else if(li===blk.b.ln){a=0;b=blk.b.col;}
      if(b>a)for(let c=a;c<Math.min(b,COLS);c++)drawCell(c,r+i,(s[c]||' '),true);
    }
  }
  const crow=r+(S.ln-S.top);
  if(crow>=r&&crow<24&&!S.prompt&&blinkOn){
    const line=S.doc[S.ln]||'';
    const ch=(S.col<line.length)?line[S.col]:' ';
    drawCell(Math.min(S.col,COLS-1),crow,ch,true);
  }
  bottomLine(true);
}
function drawTxtZoom(r,s){
  s=(s||'').slice(0,viewCols);
  for(let i=0;i<s.length;i++)drawCell(i,r,s[i]);
}
function drawZoomBottom(){
  const r=viewRows-1;
  const left=S.prompt?promptText():(S.msg||'');
  const st=statusStr();
  const line=((left||'')+'  '+st).slice(0,viewCols);
  drawTxtZoom(r,line);
  if(S.prompt&&S.prompt.type==='text'&&blinkOn){
    const len=Math.min((left||'').length,viewCols-1);
    drawCell(len,r,' ',true);
  }
}
function drawEditZoom(){
  ensureVisible();
  const rows=textRows();
  const blk=normBlock();
  for(let i=0;i<rows;i++){
    const li=S.top+i;
    const line=(S.doc[li]!==undefined?S.doc[li]:'');
    const vis=line.slice(viewHscroll,viewHscroll+viewCols);
    for(let c=0;c<viewCols;c++)drawCell(c,i,(c<vis.length?vis[c]:' '));
    if(S.spellMarks&&li<S.doc.length){
      for(let c=0;c<vis.length;c++){
        const abs=viewHscroll+c;
        if(isSpellCell(li,abs))drawCell(c,i,vis[c],true);
      }
    }
    if(blk&&S.blkVis){
      let a=-1,b=-1;
      if(li>blk.a.ln&&li<blk.b.ln){a=viewHscroll;b=viewHscroll+viewCols;}
      else if(li===blk.a.ln){a=blk.a.col;b=(li===blk.b.ln)?blk.b.col:viewHscroll+viewCols;}
      else if(li===blk.b.ln){a=viewHscroll;b=blk.b.col;}
      a=Math.max(a,viewHscroll); b=Math.min(b,viewHscroll+viewCols);
      if(b>a)for(let c=a;c<b;c++)drawCell(c-viewHscroll,i,(line[c]||' '),true);
    }
  }
  const crow=S.ln-S.top;
  if(crow>=0&&crow<rows&&!S.prompt&&blinkOn){
    const dc=S.col-viewHscroll;
    if(dc>=0&&dc<viewCols){
      const line=S.doc[S.ln]||'';
      const ch=(S.col<line.length)?line[S.col]:' ';
      drawCell(dc,crow,ch,true);
    }
  }
  drawZoomBottom();
}

function keyOptions(e){
  if(e.code==='Escape'){ closeOptions(); return; }
  if(e.code==='PageUp'||e.key===','){ optPage=Math.max(0,optPage-1); return; }
  if(e.code==='PageDown'||e.key==='.'){ optPage=Math.min(4,optPage+1); return; }
  if(e.ctrlKey)return;
  const k=(e.key||'').toLowerCase();
  if(k==='f'){ toggleFullscreen(); return; }
  if(k==='t'){ setTextOnly(!document.body.classList.contains('text-only')); return; }
  if(k==='g'&&googleConfigured()&&!driveConnected&&!driveBusy){ connectDrive(); return; }
  if(k==='d'&&driveConnected){ askYN('Disconnettere Google Drive? ',y=>{ if(y)disconnectDrive(); }); return; }
  if(k.length===1&&k>=' ')beep();
}

function keyVerPick(e){
  if(e.code==='Escape'){ verPick=null; S.mode='options'; return; }
  if(e.code==='PageUp'){ verPick.idx=Math.max(0,verPick.idx-8); return; }
  if(e.code==='PageDown'){ verPick.idx=Math.min(Math.max(0,verPick.list.length-8),verPick.idx+8); return; }
  if(/^[1-9]$/.test(e.key||'')){
    const i=verPick.idx+(+e.key)-1;
    if(i>=0&&i<verPick.list.length)confirmRestoreVersion(verPick.list[i]);
  }
}
function keyMergePreview(e){
  if(e.code==='Escape'||e.key==='n'||e.key==='N'){ mergePreview=null; S.mode='open'; return; }
  if(e.code==='PageUp'){ mergePreview.idx=Math.max(0,mergePreview.idx-1); return; }
  if(e.code==='PageDown'){ mergePreview.idx=Math.min(mergePreview.merged.length-1,mergePreview.idx+1); return; }
  if(e.key==='y'||e.key==='Y'||e.code==='Enter'){
    askName('Prefisso output? ',pre=>finishMailMerge(pre),true);
  }
}

function frame(){
  const fw=isPortraitZoom()?viewCols*CW:COLS*CW;
  const fh=isPortraitZoom()?viewRows*CH:ROWS*CH;
  cx.fillStyle='#000'; cx.fillRect(0,0,fw,fh);
  cx.save();
  cx.fillStyle=getFG();
  cx.shadowColor='rgba(255,255,255,.5)';
  cx.shadowBlur=Math.max(1,FS*0.08);
  switch(S.mode){
    case 'boot': drawBoot(); break;
    case 'open': drawOpen(); break;
    case 'options': drawOptions(); break;
    case 'dir': drawDir(); break;
    case 'verpick': drawVerPick(); break;
    case 'mergepreview': drawMergePreview(); break;
    case 'edit': drawEdit(); break;
    case 'help': drawHelp(); break;
    case 'dos': drawDos(); break;
    case 'exit': drawExit(); break;
  }
  cx.restore();
}
function loop(t){
  if(t-lastBlink>530){ blinkOn=!blinkOn; lastBlink=t; }
  if(S.mode==='boot'){
    if(VSF&&VSF.cfg.bootEnabled===false)S.mode='open';
    else if(Date.now()-S.bootAt>1600)S.mode='open';
  }
  frame();
  requestAnimationFrame(loop);
}

/* ------------------------------ DISPATCH EVENTI TASTIERA ------------------------------ */
const keyin=document.getElementById('keyin');
function isBarOpen(){ return document.body.classList.contains('showbar'); }
function focusKeyin(){
  if(IS_TOUCH&&!isBarOpen()){
    resetPageScroll();
    try{keyin.focus({preventScroll:true});}catch(e){}
    requestAnimationFrame(()=>{ applyViewportLayout(); fit(); });
  }
}
function blurKeyin(){ try{keyin.blur();}catch(e){} }
function dispatch(e){
  if(e.key==='F12')return;
  if(e.key==='F11'||e.code==='F11'){ toggleFullscreen(); return; }
  if(shouldPlayKeyClick(e))keyClickFor(e);
  if(S.prompt){ handlePrompt(e); return; }
  switch(S.mode){
    case 'boot': S.mode='open'; break;
    case 'exit': if(e.key==='r'||e.key==='R'||e.key==='Enter'||e.code==='Enter')location.reload(); break;
    case 'open': keyOpen(e); break;
    case 'options': keyOptions(e); break;
    case 'dir': keyDir(e); break;
    case 'verpick': keyVerPick(e); break;
    case 'mergepreview': keyMergePreview(e); break;
    case 'help': keyHelp(e); break;
    case 'dos': keyDos(e); break;
    case 'edit': keyEdit(e); break;
  }
}
window.addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(e.key==='F12')return;
  if(e.ctrlKey&&e.shiftKey&&['KeyI','KeyJ','KeyC'].indexOf(e.code)>=0)return;
  // caratteri semplici digitati nella textarea nascosta: gestiti dall'evento 'input'
  if(e.target===keyin&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key&&e.key.length===1&&e.key>=' ')return;
  dispatch(e);
  e.preventDefault();
});
keyin.addEventListener('input',()=>{
  const t=keyin.value; keyin.value='';
  for(const ch of t){ if(ch>=' ')dispatch({key:ch,code:'',ctrlKey:false,altKey:false,metaKey:false}); }
});
keyin.addEventListener('focus',()=>{ resetPageScroll(); requestAnimationFrame(()=>{ applyViewportLayout(); fit(); }); });
keyin.addEventListener('blur',()=>{
  if(speechActive)stopSpeech();
  if(IS_TOUCH&&!isBarOpen()&&S.mode!=='exit')setTimeout(focusKeyin,80);
});

/* scroll documento: touch (mobile) e rotella (PC) */
const scrbEl=document.getElementById('scrb');
let panState=null;
function updateEditScrollClass(){
  document.body.classList.toggle('edit-scroll',S.mode==='edit'&&!!panState&&panState.moved);
}
scrbEl.addEventListener('touchstart',e=>{
  if(S.prompt||e.touches.length!==1)return;
  if(S.mode==='edit'||S.mode==='open'||S.mode==='dir'){
    panState={y0:e.touches[0].clientY,lastY:e.touches[0].clientY,top0:S.top,moved:false,acc:0};
  }
},{passive:true});
scrbEl.addEventListener('touchmove',e=>{
  if(!panState||S.mode!=='edit'||S.prompt)return;
  const y=e.touches[0].clientY;
  const dy=y-panState.lastY;
  panState.lastY=y;
  if(Math.abs(y-panState.y0)>10)panState.moved=true;
  if(!panState.moved)return;
  e.preventDefault();
  updateEditScrollClass();
  panState.acc+=dy;
  const r=cv.getBoundingClientRect();
  const lineH=r.height/Math.max(1,textRows())||CH||24;
  while(panState.acc<=-lineH*0.55){ scroll(1); panState.acc+=lineH; }
  while(panState.acc>=lineH*0.55){ scroll(-1); panState.acc-=lineH; }
},{passive:false});
scrbEl.addEventListener('touchend',e=>{
  if(!panState)return;
  if(!panState.moved&&e.changedTouches[0]){
    screenTapAt(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
  }
  panState=null;
  updateEditScrollClass();
});
scrbEl.addEventListener('touchcancel',()=>{ panState=null; updateEditScrollClass(); });
cv.addEventListener('click',e=>{ screenTapAt(e.clientX,e.clientY); });
cv.addEventListener('mousemove',e=>{ updateFileHover(e.clientX,e.clientY); });
function onFileContextMenu(e){
  e.preventDefault();
  if(S.prompt||!(S.mode==='open'||S.mode==='dir'))return;
  const cell=canvasToCell(e.clientX,e.clientY);
  if(!cell)return;
  let name=hitTestFile(cell.row,cell.col);
  if(!name||name==='__menu__'||name==='__foprev__'||name==='__fonext__'||name==='__fdprev__'||name==='__fdnext__')return;
  if(name.indexOf('recent:')===0)name=name.slice(7);
  showFileCtxMenu(e.clientX,e.clientY,name);
}

scrbEl.addEventListener('contextmenu',onFileContextMenu);
