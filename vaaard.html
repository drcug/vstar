<!DOCTYPE html>
<html lang="it">
<!-- ============================================================
     WORDSTAR 4.0 per MS-DOS — clone fedele in HTML5/JS vanilla
     Schermo: 80 colonne x 25 righe, testo bianco su nero.
     Interfaccia in ITALIANO, utilizzabile anche da mobile.
     ============================================================ -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WORDSTAR 4.0 — clone MS-DOS (80x25)</title>
<link rel="icon" href="https://image.qwenlm.ai/public_source/65c69ebf-e819-431a-b6f8-3dfce81a99a1/147e539c9-f198-451f-8f27-b98f9fc5bf74.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vt323/index.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  #wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw}
  #scrb{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{display:block;background:#000;touch-action:manipulation}
  /* leggero effetto CRT (scanline + vignettatura) */
  #crt{pointer-events:none;position:fixed;inset:0;z-index:3;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.45) 100%);}
  /* ------- barra comandi touch ------- */
  #bar{display:none;flex:0 0 auto;background:#000;border-top:1px solid #444;padding:4px 4px calc(4px + env(safe-area-inset-bottom));flex-direction:column;gap:4px;z-index:4}
  body.showbar #bar{display:flex}
  #bar .row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  #bar button{font-family:"VT323","Courier New",monospace;font-size:clamp(13px,3.6vw,19px);line-height:1;
    background:#000;color:#fff;border:1px solid #fff;border-radius:0;padding:9px 8px;min-width:34px;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #bar button.on{background:#fff;color:#000}
  #grid{display:none}
  #bar.gridopen #grid{display:flex}
  #grid button{min-width:30px;flex:1 1 auto;max-width:56px}
  #togglebar{position:fixed;top:6px;right:6px;z-index:6;font-family:"VT323","Courier New",monospace;
    font-size:20px;background:#000;color:#fff;border:1px solid #fff;padding:3px 10px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #togglebar.on{background:#fff;color:#000}
  /* campo nascosto per aprire la tastiera di sistema su mobile */
  #keyin{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;border:0;padding:0;
    background:transparent;color:transparent;font-size:16px;z-index:1;resize:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="scrb"><canvas id="scr"></canvas></div>
  <div id="bar">
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
    <div class="row" id="grid"></div>
  </div>
</div>
<button id="togglebar">⌨ TASTIERA</button>
<textarea id="keyin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="enter"></textarea>
<div id="crt"></div>
<script>
'use strict';
/* ------------------------------ COSTANTI ------------------------------ */
const COLS=80, ROWS=25, RM=65, PAGE_LEN=66, LS_KEY='wordstar4_disk';
const FG='#ffffff';
const IS_TOUCH=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);

/* ------------------------------ STATO ------------------------------ */
const S={
  mode:'boot', helpFrom:'open',
  helpLevel:3, ruler:true, wrapOn:true, ins:true,
  doc:[''], ln:0, col:0, top:0,
  filename:'', dirty:false,
  blk:null, blkVis:true,
  markers:new Array(10).fill(null),
  prevPos:null,
  msg:'', prompt:null, pending:null,
  lastFind:'', lastRepl:'',
  helpPage:0,
  dosLines:[], dosInput:'', dosFrom:'open',
  undoStack:[], bootAt:Date.now()
};

/* ------------------------------ DISCO VIRTUALE (localStorage) ------------------------------ */
const README=
"BENVENUTO IN WORDSTAR (R) 4.0\n"+
"=============================\n"+
"\n"+
"Clone del leggendario word processor per MS-DOS:\n"+
"schermo 80 colonne x 25 righe, testo bianco su nero.\n"+
"\n"+
"IL DIAMANTE DEL CURSORE\n"+
"  ^S sinistra  ^D destra  ^E su  ^X giu'\n"+
"  ^A parola sx  ^F parola dx\n"+
"  ^R pagina su  ^C pagina giu'  (anche PgUp/PgDn)\n"+
"\n"+
"SCRIVERE\n"+
"  RETURN fine paragrafo  BACKSPACE(^H) cancella a sinistra\n"+
"  CANC cancella carattere  ^T parola  ^Y riga\n"+
"  ^V INSERIMENTO on/off   ^U annulla   ^B riformatta\n"+
"  TAB indentazione\n"+
"\n"+
"BLOCCHI E FILE\n"+
"  ^KB inizio blocco  ^KK fine blocco  ^KH mostra/nascondi\n"+
"  ^KC copia  ^KV sposta  ^KY elimina\n"+
"  ^KW scrivi blocco su file  ^KR leggi file nel cursore\n"+
"  ^KS salva e continua  ^KD salva e torna al menu'\n"+
"  ^KQ abbandona  ^KT salva con nome\n"+
"\n"+
"CERCARE\n"+
"  ^QF trova  ^QA sostituisci  ^L ripeti  ^QP posizione prec.\n"+
"\n"+
"SU TELEFONO/TABLET\n"+
"  Tocca lo schermo per spostare il cursore.\n"+
"  Usa il pulsante TASTIERA qui sotto per i comandi ^:\n"+
"  prima CTRL, poi la lettera (es. CTRL+S, CTRL+K, CTRL+Q).\n"+
"  Il testo si digita con la tastiera del dispositivo.\n"+
"\n"+
"Nota: alcuni Ctrl (^T ^W ^N) possono essere intercettati\n"+
"dal browser: usa Ctrl+Backspace per ^T.\n"+
"I file restano nel browser (localStorage). Buona scrittura!\n";

let disk=null;
try{ disk=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
if(!disk||typeof disk!=='object'){ disk={'README.TXT':README}; try{localStorage.setItem(LS_KEY,JSON.stringify(disk));}catch(e){} }
function saveDisk(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(disk)); }catch(e){} }

/* ------------------------------ CANVAS 80x25 ------------------------------ */
const cv=document.getElementById('scr'), cx=cv.getContext('2d');
let FS=20, CW=10, CH=24;
function applyFont(){ cx.font=FS+'px "VT323","Courier New",monospace'; cx.textAlign='center'; cx.textBaseline='middle'; }
function fit(){
  const box=document.getElementById('scrb');
  const W=Math.max(200,box.clientWidth||innerWidth);
  const H=Math.max(140,box.clientHeight||innerHeight);
  const probe=document.createElement('canvas').getContext('2d');
  probe.font='100px "VT323","Courier New",monospace';
  const m=probe.measureText('M');
  const cwu=m.width/100;
  const asc=m.actualBoundingBoxAscent||78, des=m.actualBoundingBoxDescent||22;
  const chu=Math.max((asc+des)/100*1.22,1.02);
  FS=Math.max(5,Math.floor(Math.min(W/(COLS*cwu),H/(ROWS*chu)))-1);
  applyFont();
  CW=cx.measureText('M').width;
  CH=FS*chu;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(COLS*CW*dpr); cv.height=Math.round(ROWS*CH*dpr);
  cv.style.width=Math.round(COLS*CW)+'px'; cv.style.height=Math.round(ROWS*CH)+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
  applyFont();
}
let blinkOn=true,lastBlink=0;
function drawCell(c,r,ch,inv){
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  const x=c*CW,y=r*CH;
  if(inv){
    cx.save(); cx.shadowBlur=0;
    cx.fillStyle=FG; cx.fillRect(x,y,CW+0.7,CH);
    cx.fillStyle='#000'; cx.fillText(ch,x+CW/2,y+CH/2+FS*0.05);
    cx.restore();
  }else{
    cx.fillText(ch,x+CW/2,y+CH/2+FS*0.05);
  }
}
function drawTxt(r,c,s,inv){
  s=s||'';
  for(let i=0;i<s.length&&c+i<COLS;i++){ if(c+i<0)continue; drawCell(c+i,r,s[i],inv); }
}
function center(r,s){ drawTxt(r,Math.max(0,Math.floor((COLS-s.length)/2)),s); }
function padLine(parts){
  const total=parts.reduce((a,p)=>a+p.length,0);
  const gaps=parts.length-1, extra=COLS-total;
  if(gaps<=0||extra<0)return parts.join(' ').slice(0,COLS);
  const base=Math.floor(extra/gaps), rem=extra%gaps;
  let out='';
  parts.forEach((p,i)=>{ out+=p; if(i<gaps)out+=' '.repeat(base+(i<rem?1:0)); });
  return out;
}

/* ------------------------------ MENU A SCHERMO (in italiano) ------------------------------ */
function menuLines(){
  return [
    padLine(['^G Aiuto','^O Schermo','^R Esegui','^K Blocco','^Q Esci','^J  '+S.helpLevel]),
    padLine(['^S car <-','^D car ->','^E riga su','^X riga giu','^A parola <-','^F parola ->']),
    padLine(['^T canc parola','^Y canc riga','^V ins/sopr','^U annulla','^B riformatta'])
  ];
}
const RULER='----+----1----+----2----+----3----+----4----+----5----+----6----+----7----'.padEnd(COLS);
const KMENU='^K: BK marca C copia V muovi Y canc H nasc W scr|S salva D fatto X esci Q lascia';
const QMENU='^Q: S/D riga E/X schermo R/C file W/Z scorri P prec F trova A sost 0-9 B/K blocco';
const OMENU='^O: R righello  W a capo autom.  I livello aiuto  (esc annulla)';

/* ------------------------------ AUDIO (beep) ------------------------------ */
let AC=null;
function beep(f,d){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),v=AC.createGain();
    o.type='square'; o.frequency.value=f||880; v.gain.value=0.03;
    o.connect(v); v.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+(d||0.06));
  }catch(e){}
}
function say(m){ S.msg=m; }

/* ------------------------------ UTILITA' CURSORE/TESTO ------------------------------ */
function cur(){ return {ln:S.ln,col:S.col}; }
function clampCursor(){
  if(S.ln<0)S.ln=0; if(S.ln>S.doc.length-1)S.ln=S.doc.length-1;
  const L=(S.doc[S.ln]||'').length;
  if(S.col<0)S.col=0; if(S.col>L)S.col=L; if(S.col>COLS-1)S.col=COLS-1;
}
function editTextTop(){ return Math.min(3,S.helpLevel)+(S.ruler?1:0); }
function textRows(){ return 24-editTextTop(); }
function ensureVisible(){
  const rows=textRows();
  if(S.ln<S.top)S.top=S.ln;
  if(S.ln>=S.top+rows)S.top=S.ln-rows+1;
  if(S.top<0)S.top=0;
}
function absPos(p){ let n=0; for(let i=0;i<p.ln;i++)n+=(S.doc[i]||'').length+1; return n+Math.min(p.col,(S.doc[p.ln]||'').length); }
function unabsPos(n){ for(let i=0;i<S.doc.length;i++){ const L=(S.doc[i]||'').length+1; if(n<L)return{ln:i,col:n}; n-=L; } const l=S.doc.length-1; return {ln:l,col:(S.doc[l]||'').length}; }
function normBlock(){
  if(!S.blk)return null;
  const a=S.blk.s,b=S.blk.e;
  const cmp=(p,q)=>p.ln-q.ln||p.col-q.col;
  return cmp(a,b)<=0?{a:{ln:a.ln,col:a.col},b:{ln:b.ln,col:b.col}}:{a:{ln:b.ln,col:b.col},b:{ln:a.ln,col:a.col}};
}
function blockText(){
  const n=normBlock(); if(!n)return[];
  const out=[];
  if(n.a.ln===n.b.ln)out.push((S.doc[n.a.ln]||'').slice(n.a.col,n.b.col));
  else{
    out.push((S.doc[n.a.ln]||'').slice(n.a.col));
    for(let l=n.a.ln+1;l<n.b.ln;l++)out.push(S.doc[l]||'');
    out.push((S.doc[n.b.ln]||'').slice(0,n.b.col));
  }
  return out;
}

/* ------------------------------ MOVIMENTO ------------------------------ */
function curLeft(){ if(S.col>0)S.col--; else if(S.ln>0){S.ln--;S.col=(S.doc[S.ln]||'').length;} }
function curRight(){ const L=(S.doc[S.ln]||'').length; if(S.col<L)S.col++; else if(S.ln<S.doc.length-1){S.ln++;S.col=0;} }
function curUp(){ if(S.ln>0){S.ln--;clampCursor();} }
function curDown(){ if(S.ln<S.doc.length-1){S.ln++;clampCursor();} }
function wordLeft(){
  const line=S.doc[S.ln]||''; let i=S.col;
  if(i===0){ if(S.ln>0){S.ln--;S.col=(S.doc[S.ln]||'').length;} return; }
  i--; while(i>0&&line[i]===' ')i--;
  while(i>0&&line[i-1]!==' ')i--;
  S.col=i;
}
function wordRight(){
  const line=S.doc[S.ln]||''; let i=S.col;
  while(i<line.length&&line[i]!==' ')i++;
  while(i<line.length&&line[i]===' ')i++;
  if(i>=line.length&&S.ln<S.doc.length-1){S.ln++;S.col=0;} else S.col=i;
}
function lineStart(){ S.col=0; }
function lineEnd(){ S.col=(S.doc[S.ln]||'').length; }
function screenTop(){ S.ln=S.top;S.col=0; }
function screenBot(){ S.ln=Math.min(S.top+textRows()-1,S.doc.length-1);S.col=0; }
function savePrev(){ S.prevPos=cur(); }
function gotoPos(p){ S.ln=p.ln;S.col=p.col;clampCursor();ensureVisible(); }
function docTop(){ savePrev(); S.ln=0;S.col=0;S.top=0; }
function docEnd(){ savePrev(); S.ln=S.doc.length-1;S.col=(S.doc[S.ln]||'').length; }
function gotoPrev(){ if(!S.prevPos){beep();return;} const t=cur(); gotoPos(S.prevPos); S.prevPos=t; }
function pageUp(){ const r=textRows()-1; S.top=Math.max(0,S.top-r); S.ln=Math.max(0,S.ln-r); clampCursor(); }
function pageDown(){ const r=textRows()-1; S.top=Math.min(Math.max(0,S.doc.length-1),S.top+r); S.ln=Math.min(S.doc.length-1,S.ln+r); clampCursor(); }
function scroll(d){ S.top=Math.max(0,S.top+d); if(S.ln<S.top)S.ln=S.top; const rows=textRows(); if(S.ln>=S.top+rows)S.ln=S.top+rows-1; clampCursor(); }

/* ------------------------------ EDITING ------------------------------ */
function pushUndo(){ S.undoStack.push({doc:S.doc.slice(),ln:S.ln,col:S.col}); if(S.undoStack.length>200)S.undoStack.shift(); }
function undo(){ const u=S.undoStack.pop(); if(!u){beep();return;} S.doc=u.doc;S.ln=u.ln;S.col=u.col;S.dirty=true;clampCursor();ensureVisible();say('Annullato'); }
function wrapLine(li){
  const line=S.doc[li]||'';
  if(line.length<=RM)return;
  let sp=-1;
  for(let i=Math.min(RM,line.length-1);i>=0;i--){ if(line[i]===' '){sp=i;break;} }
  if(sp<=0){
    if(line.length>=COLS){ S.doc[li]=line.slice(0,COLS-1); if(S.ln===li&&S.col>COLS-1)S.col=COLS-1; }
    return;
  }
  const head=line.slice(0,sp), tail=line.slice(sp+1);
  S.doc[li]=head;
  let added=0;
  if(li+1<S.doc.length&&(S.doc[li+1]||'').trim()!==''){
    const sep=(S.doc[li+1]||'').startsWith(' ')?'':' ';
    S.doc[li+1]=tail+sep+S.doc[li+1];
    added=tail.length+sep.length;
  }else{
    S.doc.splice(li+1,0,tail);
  }
  if(S.ln===li&&S.col>sp){ S.ln=li+1; S.col-=sp+1; }
  else if(S.ln===li+1){ S.col+=added; }
  if((S.doc[li+1]||'').length>RM)wrapLine(li+1);
}
function typeChar(ch){
  let line=S.doc[S.ln]||'';
  if(!S.ins&&S.col<line.length)line=line.slice(0,S.col)+ch+line.slice(S.col+1);
  else line=line.slice(0,S.col)+ch+line.slice(S.col);
  S.col++;
  S.doc[S.ln]=line;
  if(S.wrapOn)wrapLine(S.ln);
  S.dirty=true;
}
function insertChar(ch){ pushUndo(); typeChar(ch); ensureVisible(); }
function backspace(){
  pushUndo();
  if(S.col>0){
    const line=S.doc[S.ln]||'';
    S.doc[S.ln]=line.slice(0,S.col-1)+line.slice(S.col);
    S.col--;
  }else if(S.ln>0){
    const prev=S.doc[S.ln-1]||'';
    S.col=prev.length;
    S.doc[S.ln-1]=prev+(S.doc[S.ln]||'');
    S.doc.splice(S.ln,1);
    S.ln--;
    if(S.wrapOn)wrapLine(S.ln);
  }
  S.dirty=true; ensureVisible();
}
function delChar(){
  pushUndo();
  const line=S.doc[S.ln]||'';
  if(S.col<line.length)S.doc[S.ln]=line.slice(0,S.col)+line.slice(S.col+1);
  else if(S.ln<S.doc.length-1){ S.doc[S.ln]=line+S.doc[S.ln+1]; S.doc.splice(S.ln+1,1); if(S.wrapOn)wrapLine(S.ln); }
  S.dirty=true; ensureVisible();
}
function delWord(){
  pushUndo();
  const line=S.doc[S.ln]||'';
  const seg=line.slice(S.col);
  if(seg.trim()===''&&S.ln<S.doc.length-1){
    S.doc[S.ln]=line.slice(0,S.col)+S.doc[S.ln+1];
    S.doc.splice(S.ln+1,1);
  }else{
    let i=S.col;
    while(i<line.length&&line[i]!==' ')i++;
    while(i<line.length&&line[i]===' ')i++;
    S.doc[S.ln]=line.slice(0,S.col)+line.slice(i);
  }
  S.dirty=true; ensureVisible();
}
function delLine(){
  pushUndo();
  S.doc.splice(S.ln,1);
  if(!S.doc.length)S.doc=[''];
  S.col=0; clampCursor(); S.dirty=true; ensureVisible();
}
function newPara(){ pushUndo(); newParaRaw(); S.dirty=true; ensureVisible(); }
function newParaRaw(){
  const line=S.doc[S.ln]||'';
  const rest=line.slice(S.col);
  S.doc[S.ln]=line.slice(0,S.col).replace(/\s+$/,'');
  S.doc.splice(S.ln+1,0,rest);
  S.ln++;S.col=0;
}
function blankLine(){ pushUndo(); S.doc.splice(S.ln,0,''); S.col=0;S.dirty=true;ensureVisible(); }
function insertTab(){ pushUndo(); const n=8-(S.col%8)||8; for(let i=0;i<n;i++)typeChar(' '); ensureVisible(); }
function toggleIns(){ S.ins=!S.ins; say(S.ins?'INSERIMENTO':'SOVRASCRITTURA'); }
function reformat(){
  pushUndo();
  let s=S.ln; while(s>0&&(S.doc[s-1]||'').trim()!=='')s--;
  let e=S.ln; while(e<S.doc.length-1&&(S.doc[e+1]||'').trim()!=='')e++;
  const words=S.doc.slice(s,e+1).map(t=>t.trim()).filter(Boolean).join(' ');
  const out=[]; let line='';
  for(const w of words.split(/\s+/)){
    if(!w)continue;
    if(!line)line=w;
    else if((line+' '+w).length<=RM)line+=' '+w;
    else{ out.push(line); line=w; }
    while(line.length>RM){ out.push(line.slice(0,RM)); line=line.slice(RM); }
  }
  out.push(line);
  S.doc.splice(s,e-s+1,...out);
  S.ln=s;S.col=0;S.dirty=true;ensureVisible();
  say('Paragrafo riformattato');
}
function insertTextRaw(t){
  for(const ch of t){
    if(ch==='\n')newParaRaw();
    else if(ch!=='\r'&&ch>=' ')typeChar(ch);
  }
}
function insertLines(lines){
  pushUndo();
  const full=S.doc.join('\n');
  const c=absPos(cur());
  const text=lines.join('\n');
  S.doc=(full.slice(0,c)+text+full.slice(c)).split('\n');
  const p=unabsPos(c+text.length); S.ln=p.ln;S.col=p.col;
  S.dirty=true; ensureVisible();
}

/* ------------------------------ BLOCCHI ------------------------------ */
function blockOp(kind){
  const n=normBlock();
  if(!n){ say('Nessun blocco marcato'); beep(); return; }
  pushUndo();
  const full=S.doc.join('\n');
  const a=absPos(n.a), b=absPos(n.b);
  const text=full.slice(a,b);
  const c0=absPos(cur());
  if(kind==='del'){
    const nc=c0>b?c0-(b-a):(c0>=a?a:c0);
    S.doc=(full.slice(0,a)+full.slice(b)).split('\n');
    const p=unabsPos(nc); S.ln=p.ln;S.col=p.col;
    say('Blocco cancellato');
  }else if(kind==='move'){
    const rest=full.slice(0,a)+full.slice(b);
    const c=c0>b?c0-(b-a):(c0>=a?a:c0);
    S.doc=(rest.slice(0,c)+text+rest.slice(c)).split('\n');
    const p=unabsPos(c+text.length); S.ln=p.ln;S.col=p.col;
    say('Blocco spostato');
  }else{
    S.doc=(full.slice(0,c0)+text+full.slice(c0)).split('\n');
    const p=unabsPos(c0+text.length); S.ln=p.ln;S.col=p.col;
    say('Blocco copiato');
    try{ if(navigator.clipboard)navigator.clipboard.writeText(text.replace(/\n/g,'\r\n')).catch(()=>{}); }catch(e){}
  }
  S.dirty=true; clampCursor(); ensureVisible();
}

/* ------------------------------ CERCA / SOSTITUISCI ------------------------------ */
function findNext(q,from){
  const full=S.doc.join('\n').toLowerCase();
  const ql=q.toLowerCase();
  let i=full.indexOf(ql,Math.min(absPos(from)+1,full.length));
  if(i<0)i=full.indexOf(ql);
  if(i<0)return null;
  return unabsPos(i);
}
function doFind(){
  ask('Cercare? ',q=>{
    S.lastFind=q;
    const p=findNext(q,cur());
    if(!p){ say('"'+q+'" non trovato'); beep(); }
    else{ savePrev(); gotoPos(p); say(''); }
  },{def:S.lastFind});
}
function repeatFind(){
  if(!S.lastFind){ say('Nessuna ricerca precedente'); beep(); return; }
  const p=findNext(S.lastFind,cur());
  if(p){ savePrev(); gotoPos(p); } else { say('Non trovato'); beep(); }
}
function doReplaceAt(p,q,r){
  const a=absPos(p);
  const full=S.doc.join('\n');
  S.doc=(full.slice(0,a)+r+full.slice(a+q.length)).split('\n');
  const np=unabsPos(a+r.length); S.ln=np.ln;S.col=np.col;
  S.dirty=true;
}
function doReplaceAsk(){
  ask('Sostituire? ',q=>{
    S.lastFind=q;
    ask('Con cosa? ',r=>{ S.lastRepl=r; replaceStep(q,r,false); },{def:S.lastRepl});
  },{def:S.lastFind});
}
function replaceStep(q,r,all){
  const p=findNext(q,cur());
  if(!p){ say('Altre occorrenze non trovate'); return; }
  gotoPos(p);
  if(all){ doReplaceAt(p,q,r); replaceStep(q,r,true); return; }
  askYN('Sostituire? ',ans=>{
    if(ans==='all'){ doReplaceAt(p,q,r); replaceStep(q,r,true); }
    else if(ans){ doReplaceAt(p,q,r); replaceStep(q,r,false); }
    else replaceStep(q,r,false);
  },{all:true});
}

/* ------------------------------ PROMPT (riga messaggi) ------------------------------ */
function ask(label,cb,opt){ S.prompt={type:'text',label,value:(opt&&opt.def)||'',cb,opt:opt||{}}; }
function askYN(label,cb,opt){ S.prompt={type:'yn',label,cb,all:!!(opt&&opt.all)}; }
function askName(label,cb){ ask(label,cb,{upper:true,filter:/[^A-Z0-9._\-]/,max:12}); }
function askLevel(){ ask('Livello di aiuto (0-3)? ',v=>{ const n=parseInt(v,10); if(n>=0&&n<=3){S.helpLevel=n;say('Livello di aiuto '+n);}else{say('Livello non valido');beep();} },{filter:/[^0-9]/,max:1}); }
function promptText(){ const p=S.prompt; return p.type==='yn'?p.label+(p.all?'(S/N/T) ':'(S/N) '):p.label+p.value; }
function handlePrompt(e){
  const p=S.prompt;
  if(e.code==='Escape'){ S.prompt=null; say(''); return; }
  if(p.type==='yn'){
    const k=(e.key||'').toLowerCase();
    if(k==='s'||k==='y'){ S.prompt=null; p.cb(true); }
    else if(k==='n'){ S.prompt=null; p.cb(false); }
    else if((k==='t'||k==='a')&&p.all){ S.prompt=null; p.cb('all'); }
    else if(e.code==='Enter'){ S.prompt=null; p.cb(false); }
    else beep();
    return;
  }
  if(e.code==='Enter'){
    const v=p.value||p.opt.def||'';
    if(!v){ beep(); return; }
    S.prompt=null; p.cb(v); return;
  }
  if(e.code==='Backspace'){ p.value=p.value.slice(0,-1); return; }
  const k=e.key;
  if(!e.ctrlKey&&!e.altKey&&k&&k.length===1&&k>=' '){
    let ch=p.opt.upper?k.toUpperCase():k;
    if(p.opt.filter)ch=ch.replace(p.opt.filter,'');
    if(ch&&p.value.length<(p.opt.max||60))p.value+=ch;
  }
}

/* ------------------------------ FILE: salva/apri/stampa ------------------------------ */
function openFile(name,isDoc){
  const exists=name in disk;
  S.filename=name;
  S.wrapOn=isDoc;
  S.doc=exists?(disk[name]||'').split(/\r?\n/):[''];
  if(!S.doc.length)S.doc=[''];
  S.ln=0;S.col=0;S.top=0;S.blk=null;S.blkVis=true;S.dirty=false;
  S.undoStack.length=0;S.prevPos=null;S.markers=new Array(10).fill(null);S.pending=null;
  S.mode='edit';
  say(exists?'Aperto '+name:'Nuovo file '+name);
}
function doSave(){ disk[S.filename]=S.doc.join('\r\n'); saveDisk(); S.dirty=false; say('Salvato '+S.filename); }
function saveFile(next){
  const finish=()=>{ if(next==='open')S.mode='open'; else if(next==='exit')S.mode='exit'; };
  if(!S.filename){ askName('Salvare come? ',n=>{ S.filename=n; doSave(); finish(); }); return; }
  doSave(); finish();
}
function abandon(){
  if(S.dirty)askYN('Abbandonare le modifiche a '+S.filename+'? ',y=>{ if(y){S.mode='open';say('');} });
  else{ S.mode='open'; say(''); }
}
function noFile(n){ say(n+': file non trovato'); beep(); }
function printFile(n){
  say('Stampa di '+n+' ...');
  try{
    const blob=new Blob([disk[n]],{type:'text/plain'});
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u; a.download=n; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){ say('Errore di stampa'); }
}

/* ------------------------------ SOTTOMENU ^K ^Q ^O ------------------------------ */
function handleK(ch){
  const u=(ch||'').toUpperCase();
  if(/^[0-9]$/.test(ch)){ S.markers[+ch]=cur(); say('Marcatore '+ch+' impostato'); return; }
  switch(u){
    case 'B': S.blk={s:cur(),e:cur()}; say('Inizio blocco marcato'); break;
    case 'K': if(!S.blk){say('Nessun inizio blocco');beep();}else{S.blk.e=cur();say('Fine blocco marcata');} break;
    case 'C': blockOp('copy'); break;
    case 'V': blockOp('move'); break;
    case 'Y': blockOp('del'); break;
    case 'H': S.blkVis=!S.blkVis; say(S.blkVis?'Blocco visibile':'Blocco nascosto'); break;
    case 'W': if(!normBlock()){say('Nessun blocco marcato');beep();}else askName('Scrivere blocco nel file? ',n=>{ disk[n]=blockText().join('\r\n'); saveDisk(); say('Blocco scritto su '+n); }); break;
    case 'R': askName('Leggere quale file? ',n=>{ if(!(n in disk))return noFile(n); insertLines((disk[n]||'').split(/\r?\n/)); say(n+' inserito'); }); break;
    case 'S': saveFile('cont'); break;
    case 'T': askName('Salvare come? ',n=>{ S.filename=n; doSave(); }); break;
    case 'D': saveFile('open'); break;
    case 'X': saveFile('exit'); break;
    case 'Q': abandon(); break;
    default: beep();
  }
}
function handleQ(ch){
  const u=(ch||'').toUpperCase();
  if(/^[0-9]$/.test(ch)){ const m=S.markers[+ch]; if(m){savePrev();gotoPos(m);say('Marcatore '+ch);}else{say('Marcatore non impostato');beep();} return; }
  switch(u){
    case 'S': lineStart(); break;
    case 'D': lineEnd(); break;
    case 'E': screenTop(); break;
    case 'X': screenBot(); break;
    case 'R': docTop(); break;
    case 'C': docEnd(); break;
    case 'W': scroll(-1); break;
    case 'Z': scroll(1); break;
    case 'P': gotoPrev(); break;
    case 'B': { const b=normBlock(); if(b){savePrev();gotoPos(b.a);}else beep(); break; }
    case 'K': { const b=normBlock(); if(b){savePrev();gotoPos(b.b);}else beep(); break; }
    case 'F': doFind(); break;
    case 'A': doReplaceAsk(); break;
    default: beep();
  }
}
function handleO(ch){
  const u=(ch||'').toUpperCase();
  if(u==='R'){ S.ruler=!S.ruler; say('Righello '+(S.ruler?'ON':'OFF')); }
  else if(u==='W'){ S.wrapOn=!S.wrapOn; say('A capo automatico '+(S.wrapOn?'ON':'OFF')); }
  else if(u==='I'){ askLevel(); }
  else beep();
}
function ctrlCmd(L){
  switch(L){
    case 'S': curLeft(); break;
    case 'D': curRight(); break;
    case 'E': curUp(); break;
    case 'X': curDown(); break;
    case 'A': wordLeft(); break;
    case 'F': wordRight(); break;
    case 'W': scroll(-1); break;
    case 'Z': scroll(1); break;
    case 'R': pageUp(); break;
    case 'C': pageDown(); break;
    case 'G': openHelp(); break;
    case 'J': askLevel(); break;
    case 'O': S.pending='O'; say(OMENU); break;
    case 'K': S.pending='K'; say(KMENU); break;
    case 'Q': S.pending='Q'; say(QMENU); break;
    case 'T': delWord(); break;
    case 'Y': delLine(); break;
    case 'U': undo(); break;
    case 'V': toggleIns(); break;
    case 'B': reformat(); break;
    case 'N': blankLine(); break;
    case 'H': backspace(); break;
    case 'M': newPara(); break;
    case 'L': repeatFind(); break;
    default: beep(); say('Comando inesistente');
  }
}

function openHelp(){ S.helpFrom=S.mode; S.helpPage=0; S.mode='help'; }
function keyHelp(e){
  if(e.code==='Escape'){ S.mode=S.helpFrom; return; }
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'||e.code==='PageDown'){
    S.helpPage++;
    if(S.helpPage>=HELP_PAGES.length)S.mode=S.helpFrom;
  }else if(e.code==='ArrowUp'||e.code==='PageUp'||e.code==='Backspace'){
    S.helpPage=Math.max(0,S.helpPage-1);
  }
}

/* ------------------------------ SHELL DOS (^R) ------------------------------ */
function startDos(){
  S.dosFrom=S.mode; S.mode='dos'; S.dosInput='';
  S.dosLines=['SHELL DOS DI WORDSTAR (simulata)','','Digita HELP per i comandi, EXIT per tornare a WordStar.',''];
}
function keyDos(e){
  if(e.code==='Escape'){ S.mode=S.dosFrom; return; }
  if(e.code==='Enter'){ dosExec(S.dosInput); S.dosInput=''; return; }
  if(e.code==='Backspace'){ S.dosInput=S.dosInput.slice(0,-1); return; }
  const k=e.key;
  if(!e.ctrlKey&&!e.altKey&&k&&k.length===1&&k>=' ')S.dosInput+=k;
}
function dosExec(inp){
  const parts=inp.trim().split(/\s+/);
  const cmd=(parts[0]||'').toUpperCase();
  const push=s=>S.dosLines.push(s);
  push('C:\\WS>'+inp);
  switch(cmd){
    case '': break;
    case 'HELP': push('Comandi: DIR TYPE n CLS VER ECHO t REN a b COPY a b DEL n EXIT'); break;
    case 'VER': push('MS-DOS versione 4.01 (simulata)'); break;
    case 'CLS': S.dosLines=[]; break;
    case 'EXIT': S.mode=S.dosFrom; break;
    case 'DIR':
      push(' Directory di A:\\'); push('');
      Object.keys(disk).sort().forEach(n=>push('  '+n.padEnd(14)+String((disk[n]||'').length).padStart(6)+'  19-08-26'));
      push(''); push('  '+Object.keys(disk).length+' file');
      break;
    case 'TYPE': { const n=(parts[1]||'').toUpperCase(); if(!(n in disk)){push('File non trovato');break;} (disk[n]||'').split(/\r?\n/).slice(0,60).forEach(l=>push(l.slice(0,COLS))); break; }
    case 'REN': { const a=(parts[1]||'').toUpperCase(),b=(parts[2]||'').toUpperCase(); if(!(a in disk))push('File non trovato'); else if(!b||b in disk)push('Nome file duplicato'); else{disk[b]=disk[a];delete disk[a];saveDisk();} break; }
    case 'COPY': { const a=(parts[1]||'').toUpperCase(),b=(parts[2]||'').toUpperCase(); if(!(a in disk))push('File non trovato'); else if(!b||b in disk)push('Nome file duplicato'); else{disk[b]=disk[a];saveDisk();push(' 1 file copiato');} break; }
    case 'DEL': case 'ERASE': { const a=(parts[1]||'').toUpperCase(); if(!(a in disk))push('File non trovato'); else{delete disk[a];saveDisk();} break; }
    case 'ECHO': push(parts.slice(1).join(' ')); break;
    default: push('Comando o file non trovato');
  }
  if(S.dosLines.length>200)S.dosLines=S.dosLines.slice(-200);
}

/* ------------------------------ MENU PRINCIPALE (APERTURA) ------------------------------ */
function fmtSize(n){ return n>=1024?(n/1024).toFixed(1)+'K':n+'B'; }
function dateStr(){
  const d=new Date();
  const mo=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'][d.getMonth()];
  return ('0'+d.getDate()).slice(-2)+'-'+mo+'-'+d.getFullYear();
}
function keyOpen(e){
  if(e.code==='F1'){ openHelp(); return; }
  if(e.ctrlKey)return;
  const k=(e.key||'').toLowerCase();
  switch(k){
    case 'd': askName('Nome del file da modificare? ',n=>openFile(n,true)); break;
    case 'n': askName('Nome del non-documento? ',n=>openFile(n,false)); break;
    case 'f': S.mode='dir'; break;
    case 'e': askName('Rinominare quale file? ',a=>{ if(!(a in disk))return noFile(a);
        askName('Nuovo nome? ',b=>{ if(b in disk)return say('File gia\' esistente'); disk[b]=disk[a]; delete disk[a]; saveDisk(); say(a+' rinominato in '+b); }); }); break;
    case 'o': askName('Copiare quale file? ',a=>{ if(!(a in disk))return noFile(a);
        askName('Destinazione? ',b=>{ if(b in disk)return say('File gia\' esistente'); disk[b]=disk[a]; saveDisk(); say(a+' copiato in '+b); }); }); break;
    case 'y': askName('Cancellare quale file? ',a=>{ if(!(a in disk))return noFile(a);
        askYN('Cancellare '+a+'? ',y=>{ if(y){ delete disk[a]; saveDisk(); say(a+' cancellato'); } }); }); break;
    case 'p': askName('Stampare quale file? ',a=>{ if(!(a in disk))return noFile(a); printFile(a); }); break;
    case 'h': askLevel(); break;
    case 'r': startDos(); break;
    case 'l': say('Drive corrente: A:'); break;
    case 'm': say('MailMerge non installato'); break;
    case 's': say('SpellStar non installato'); break;
    case 'x': askYN('Uscire da WordStar? ',y=>{ if(y)S.mode='exit'; }); break;
    default: if(k.length===1&&k>=' ')beep();
  }
}

/* ------------------------------ TASTIERA: EDITOR ------------------------------ */
function keyEdit(e){
  const k=e.key, ctrl=e.ctrlKey&&!e.metaKey;
  const letter=(e.code&&e.code.indexOf('Key')===0)?e.code.slice(3):null;
  if(S.pending){
    const p=S.pending; S.pending=null;
    if(e.code!=='Escape'){
      const ch=(k&&k.length===1)?k:'';
      if(p==='K')handleK(ch); else if(p==='Q')handleQ(ch); else if(p==='O')handleO(ch);
    }
    return;
  }
  switch(e.code){
    case 'F1': openHelp(); return;
    case 'F2': saveFile('cont'); return;
    case 'F3': doFind(); return;
    case 'F4': doReplaceAsk(); return;
    case 'ArrowLeft': curLeft(); return;
    case 'ArrowRight': curRight(); return;
    case 'ArrowUp': curUp(); return;
    case 'ArrowDown': curDown(); return;
    case 'PageUp': pageUp(); return;
    case 'PageDown': pageDown(); return;
    case 'Home': ctrl?docTop():lineStart(); return;
    case 'End': ctrl?docEnd():lineEnd(); return;
    case 'Insert': toggleIns(); return;
    case 'Delete': delChar(); return;
    case 'Backspace': ctrl?delWord():backspace(); return;
    case 'Enter': newPara(); return;
    case 'Tab': insertTab(); return;
    case 'Escape': S.msg=''; return;
  }
  if(ctrl&&letter){ ctrlCmd(letter); return; }
  if(!ctrl&&!e.altKey&&k&&k.length===1&&k>=' '){ insertChar(k); return; }
}

/* ------------------------------ DISEGNO SCHERMATE ------------------------------ */
function statusStr(){ return 'Col '+(S.col+1)+'  Rg '+(S.ln+1)+'  Pg '+(Math.floor(S.ln/PAGE_LEN)+1); }
function bottomLine(showStatus){
  const left=S.prompt?promptText():S.msg;
  drawTxt(24,0,(left||'').slice(0,62));
  if(S.prompt&&S.prompt.type==='text'&&blinkOn)drawCell(Math.min((left||'').length,79),24,' ',true);
  if(showStatus){
    const st=statusStr();
    if(!S.prompt||(left||'').length+2+st.length<=COLS)drawTxt(24,COLS-st.length,st);
  }
}
function drawEdit(){
  const M=menuLines();
  let r=0;
  for(let i=0;i<Math.min(3,S.helpLevel);i++)drawTxt(r++,0,M[i]);
  if(S.ruler&&r<24)drawTxt(r++,0,RULER);
  const rows=24-r;
  ensureVisible();
  const blk=normBlock();
  for(let i=0;i<rows;i++){
    const li=S.top+i;
    const s=(S.doc[li]!==undefined?S.doc[li]:'').slice(0,COLS);
    drawTxt(r+i,0,s.padEnd(COLS));
    if(blk&&S.blkVis){
      let a=-1,b=-1;
      if(li>blk.a.ln&&li<blk.b.ln){a=0;b=COLS;}
      else if(li===blk.a.ln){a=blk.a.col;b=(li===blk.b.ln)?blk.b.col:COLS;}
      else if(li===blk.b.ln){a=0;b=blk.b.col;}
      if(b>a)for(let c=a;c<Math.min(b,COLS);c++)drawCell(c,r+i,(s[c]||' '),true);
    }
  }
  const crow=r+(S.ln-S.top);
  if(crow>=r&&crow<24&&!S.prompt&&blinkOn){
    const line=S.doc[S.ln]||'';
    const ch=(S.col<line.length)?line[S.col]:' ';
    drawCell(Math.min(S.col,COLS-1),crow,ch,true);
  }
  bottomLine(true);
}

function drawBoot(){
  center(7,'W O R D S T A R (R)');
  center(9,'Versione 4.00  -  MS-DOS');
  center(11,'clone non ufficiale per browser - 80x25');
  center(14,'Caricamento...');
  if(innerHeight>innerWidth)center(16,'Consiglio: ruota il dispositivo in orizzontale');
  center(24,'omaggio a MicroPro International (1978-1987)');
}
function drawExit(){
  center(10,'Uscita da WordStar completata.');
  center(12,'Ora puoi chiudere questa scheda.');
  center(14,'(premi R per riavviare)');
}
function frame(){
  cx.fillStyle='#000'; cx.fillRect(0,0,COLS*CW,ROWS*CH);
  cx.save();
  cx.fillStyle=FG;
  cx.shadowColor='rgba(255,255,255,.5)';
  cx.shadowBlur=Math.max(1,FS*0.08);
  switch(S.mode){
    case 'boot': drawBoot(); break;
    case 'open': drawOpen(); break;
    case 'dir': drawDir(); break;
    case 'edit': drawEdit(); break;
    case 'help': drawHelp(); break;
    case 'dos': drawDos(); break;
    case 'exit': drawExit(); break;
  }
  cx.restore();
}
function loop(t){
  if(t-lastBlink>530){ blinkOn=!blinkOn; lastBlink=t; }
  if(S.mode==='boot'&&Date.now()-S.bootAt>1600)S.mode='open';
  frame();
  requestAnimationFrame(loop);
}

/* ------------------------------ DISPATCH EVENTI TASTIERA ------------------------------ */
const keyin=document.getElementById('keyin');
function dispatch(e){
  if(e.key==='F12')return;
  if(S.prompt){ handlePrompt(e); return; }
  switch(S.mode){
    case 'boot': S.mode='open'; break;
    case 'exit': if(e.key==='r'||e.key==='R'||e.key==='Enter'||e.code==='Enter')location.reload(); break;
    case 'open': keyOpen(e); break;
    case 'dir': S.mode='open'; break;
    case 'help': keyHelp(e); break;
    case 'dos': keyDos(e); break;
    case 'edit': keyEdit(e); break;
  }
}
window.addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(e.key==='F12')return;
  if(e.ctrlKey&&e.shiftKey&&['KeyI','KeyJ','KeyC'].indexOf(e.code)>=0)return;
  // caratteri semplici digitati nella textarea nascosta: gestiti dall'evento 'input'
  if(e.target===keyin&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key&&e.key.length===1&&e.key>=' ')return;
  dispatch(e);
  e.preventDefault();
});
keyin.addEventListener('input',()=>{
  const t=keyin.value; keyin.value='';
  for(const ch of t){ if(ch>=' ')dispatch({key:ch,code:'',ctrlKey:false,altKey:false,metaKey:false}); }
});
keyin.addEventListener('blur',()=>{ if(IS_TOUCH&&S.mode!=='exit')setTimeout(()=>{ try{keyin.focus({preventScroll:true});}catch(e){} },80); });
function focusKeyin(){ if(IS_TOUCH){ try{keyin.focus({preventScroll:true});}catch(e){} } }

/* incolla (da menu del browser / Ctrl+V dove consentito) */
window.addEventListener('paste',e=>{
  if(S.mode!=='edit'||S.prompt)return;
  const t=(e.clipboardData?e.clipboardData.getData('text'):'')||'';
  if(!t)return;
  e.preventDefault();
  pushUndo();
  insertTextRaw(t.slice(0,20000));
  S.dirty=true; ensureVisible();
});

/* tocco sullo schermo: focus tastiera + spostamento cursore */
cv.addEventListener('pointerdown',e=>{
  focusKeyin();
  if(S.mode==='edit'&&!S.prompt){
    const r=cv.getBoundingClientRect();
    const col=Math.floor((e.clientX-r.left)/r.width*COLS);
    const row=Math.floor((e.clientY-r.top)/r.height*ROWS);
    const top=editTextTop();
    if(row>=top&&row<24){
      const li=S.top+(row-top);
      if(li>=0&&li<S.doc.length){ S.ln=li; S.col=Math.min(Math.max(col,0),(S.doc[li]||'').length); ensureVisible(); }
    }
  }
});
document.getElementById('scrb').addEventListener('pointerdown',()=>focusKeyin());

/* ------------------------------ BARRA COMANDI TOUCH ------------------------------ */
let ctrlArmed=false;
const barEl=document.getElementById('bar');
function pressCtrl(letter){ dispatch({ctrlKey:true,metaKey:false,altKey:false,code:'Key'+letter,key:letter}); }
function pressPlain(ch){ dispatch({ctrlKey:false,metaKey:false,altKey:false,code:'',key:ch}); }
function pressCode(code,key){ dispatch({ctrlKey:false,metaKey:false,altKey:false,code:code,key:key||code}); }
function startRep(act,b){ stopRep(b); b._t=setTimeout(()=>{ b._i=setInterval(act,90); },400); }
function stopRep(b){ if(b._t)clearTimeout(b._t); if(b._i)clearInterval(b._i); }
function mkBtn(label,act,rep,cls){
  const b=document.createElement('button');
  b.textContent=label;
  if(cls)b.className=cls;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); act(); if(rep)startRep(act,b); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>stopRep(b)));
  return b;
}
function buildBar(){
  const r1=document.getElementById('row1');
  const r2=document.getElementById('row2');
  const grid=document.getElementById('grid');
  // riga 1: frecce, correzione, invio, esc
  r1.appendChild(mkBtn('◄',()=>pressCode('ArrowLeft'),true));
  r1.appendChild(mkBtn('▲',()=>pressCode('ArrowUp'),true));
  r1.appendChild(mkBtn('▼',()=>pressCode('ArrowDown'),true));
  r1.appendChild(mkBtn('►',()=>pressCode('ArrowRight'),true));
  r1.appendChild(mkBtn('⌫',()=>pressCode('Backspace'),true));
  r1.appendChild(mkBtn('CANC',()=>pressCode('Delete')));
  r1.appendChild(mkBtn('INVIO',()=>pressCode('Enter')));
  r1.appendChild(mkBtn('ESC',()=>pressCode('Escape')));
  // riga 2: CTRL e scorciatoie
  const bc=mkBtn('CTRL',()=>{ ctrlArmed=!ctrlArmed; bc.classList.toggle('on',ctrlArmed); });
  r2.appendChild(bc);
  r2.appendChild(mkBtn('SALVA',()=>{ pressCtrl('K'); pressPlain('S'); }));
  r2.appendChild(mkBtn('TROVA',()=>{ pressCtrl('Q'); pressPlain('F'); }));
  r2.appendChild(mkBtn('SOST',()=>{ pressCtrl('Q'); pressPlain('A'); }));
  r2.appendChild(mkBtn('AIUTO',()=>{ pressCtrl('G'); }));
  r2.appendChild(mkBtn('ANNULLA',()=>{ pressCtrl('U'); }));
  r2.appendChild(mkBtn('INS',()=>toggleIns()));
  r2.appendChild(mkBtn('ABC',()=>barEl.classList.toggle('gridopen')));
  // griglia: cifre + lettere (per i comandi ^X)
  const letterAct=ch=>{
    if(ctrlArmed){ pressCtrl(ch); ctrlArmed=false; bc.classList.remove('on'); }
    else pressPlain(ch);
  };
  '1234567890'.split('').forEach(ch=>grid.appendChild(mkBtn(ch,()=>letterAct(ch))));
  'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').forEach(ch=>grid.appendChild(mkBtn(ch,()=>letterAct(ch))));
  barEl.addEventListener('contextmenu',e=>e.preventDefault());
}
buildBar();
const tg=document.getElementById('togglebar');
function setBar(show){ document.body.classList.toggle('showbar',show); tg.classList.toggle('on',show); requestAnimationFrame(()=>requestAnimationFrame(fit)); }
tg.addEventListener('pointerdown',e=>e.preventDefault());
tg.addEventListener('click',e=>{ e.preventDefault(); setBar(!document.body.classList.contains('showbar')); });
if(IS_TOUCH)setBar(true);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ------------------------------ AVVIO ------------------------------ */
window.addEventListener('resize',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
let inited=false;
function init(){ if(inited)return; inited=true; fit(); requestAnimationFrame(loop); }
if(document.fonts&&document.fonts.load){ document.fonts.load('20px "VT323"').then(init).catch(init); }
else init();
setTimeout(init,1500);
</script>
</body>
